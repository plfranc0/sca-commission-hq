<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SCA Commission HQ</title>
<style>
:root{
  --ground:#FDF9F4; --surface:#FFFFFF; --surface-2:#F7EFEA; --surface-3:#F1E4DD;
  --ink:#221418; --ink-2:#4C3A3D; --ink-3:#8A7477;
  --accent:#7A1420; --head-bg:#7A1420; --head-ink:#FFFFFF;
  --hair:#E4D6CF; --hair-2:#F0E4DE;
  --good:#2F6B4F; --warn:#9A6B12; --crit:#B3261E;
  --good-bg:#E6F0EA; --warn-bg:#F6EEDD; --crit-bg:#F8E6E4;
  --side-bg:#221418; --side-ink:#F4EBE6; --side-ink-2:#B9A3A0; --side-hair:#3A2628; --side-active:#7A1420;
  --shadow:0 1px 2px rgba(34,20,24,.05), 0 8px 24px -14px rgba(34,20,24,.16);
  --display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17110F; --surface:#221A19; --surface-2:#2C2221; --surface-3:#352827;
    --ink:#F4EBE6; --ink-2:#C4B0AC; --ink-3:#8E7B78;
    --accent:#DC6076; --head-bg:#4A1F27; --head-ink:#F7E4E6;
    --hair:#3A2B2B; --hair-2:#2E2323;
    --good:#5FAF87; --warn:#D2A03F; --crit:#E0706A;
    --good-bg:#1D2A24; --warn-bg:#2C2418; --crit-bg:#2E1E1D;
    --side-bg:#110C0B; --side-ink:#F4EBE6; --side-ink-2:#8E7B78; --side-hair:#2A1F1F; --side-active:#4A1F27;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#17110F; --surface:#221A19; --surface-2:#2C2221; --surface-3:#352827;
  --ink:#F4EBE6; --ink-2:#C4B0AC; --ink-3:#8E7B78;
  --accent:#DC6076; --head-bg:#4A1F27; --head-ink:#F7E4E6;
  --hair:#3A2B2B; --hair-2:#2E2323;
  --good:#5FAF87; --warn:#D2A03F; --crit:#E0706A;
  --good-bg:#1D2A24; --warn-bg:#2C2418; --crit-bg:#2E1E1D;
  --side-bg:#110C0B; --side-ink:#F4EBE6; --side-ink-2:#8E7B78; --side-hair:#2A1F1F; --side-active:#4A1F27;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground); color:var(--ink-2); font-family:var(--ui); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:var(--ui)}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh}
.side{width:236px; flex:0 0 236px; background:var(--side-bg); color:var(--side-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{padding:22px 20px 18px; border-bottom:1px solid var(--side-hair)}
.brand .k{font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--side-ink-2)}
.brand .t{font-family:var(--display); font-size:21px; font-weight:600; line-height:1.15; margin-top:4px}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px}
.nav button{appearance:none; background:none; border:none; color:var(--side-ink-2); text-align:left; padding:10px 12px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; width:100%}
.nav button .ic{width:18px; text-align:center; font-family:var(--mono); font-size:12px; opacity:.8}
.nav button:hover{color:var(--side-ink); background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{background:var(--side-active); color:#fff}
.nav button .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; background:rgba(255,255,255,.12); padding:1px 7px; border-radius:10px}
.nav button .cnt.hot{background:#E0706A; color:#1a0c0c}
.side-foot{margin-top:auto; padding:16px 20px 20px; border-top:1px solid var(--side-hair); font-size:11.5px; color:var(--side-ink-2); display:flex; flex-direction:column; gap:6px}
.side-foot a{color:var(--side-ink)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#5FAF87; margin-right:6px; vertical-align:middle}
.dot.bad{background:#E0706A}
.dot.warn{background:#D2A03F}
.main{flex:1; min-width:0; padding:28px 32px 60px}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.topbar h1{font-family:var(--display); font-size:30px; font-weight:600; color:var(--ink); line-height:1.1; letter-spacing:-.01em}
.topbar .sub{font-size:13px; color:var(--ink-3); margin-top:4px}
.ctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
select,input[type="text"],input[type="password"],input[type="search"],textarea{font-family:var(--ui); font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--hair); border-radius:6px; padding:7px 10px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{appearance:none; border:1px solid var(--hair); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:6px; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit); border-color:var(--crit)}
.btn:disabled{opacity:.5; cursor:default}
.btn.sm{padding:4px 9px; font-size:11.5px}

/* ---------- panels ---------- */
.stack{display:flex; flex-direction:column; gap:18px}
.r3{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair)}
.r4{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--hair)}
@media(max-width:1000px){.r4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.r3,.r4{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--hair); border-radius:8px; overflow:hidden; box-shadow:var(--shadow)}
.panel-head{background:var(--head-bg); color:var(--head-ink); font-family:var(--display); font-size:15.5px; font-weight:600; padding:11px 16px; letter-spacing:.01em; display:flex; align-items:center; justify-content:space-between; gap:12px}
.panel-head .r{font-family:var(--ui); font-size:11.5px; font-weight:600; opacity:.85}
.cell{background:var(--surface); display:flex; flex-direction:column; min-width:0}
.cell-label{background:var(--surface-2); padding:7px 12px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cell-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:2px}
.cell-val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:23px; font-weight:600; color:var(--ink); line-height:1.1; letter-spacing:-.02em}
.cell-sub{font-size:11px; color:var(--ink-3); line-height:1.35}
.cell.good .cell-val{color:var(--good)}
.cell.bad .cell-val{color:var(--crit)}
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:640px}
th{background:var(--surface-2); color:var(--ink-3); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:right; padding:8px 12px; white-space:nowrap; border-bottom:1px solid var(--hair)}
td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--hair-2); font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap}
th.l,td.l{text-align:left; font-family:var(--ui)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.mute{color:var(--ink-3)}
th.sort{cursor:pointer; user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[data-dir="asc"]::after{content:" ↑"} th.sort[data-dir="desc"]::after{content:" ↓"}
.pill{display:inline-block; font-family:var(--ui); font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:20px; background:var(--surface-3); color:var(--ink-2)}
.pill.ok{background:var(--good-bg); color:var(--good)}
.pill.chk{background:var(--warn-bg); color:var(--warn)}
.pill.bad{background:var(--crit-bg); color:var(--crit)}
.note{border:1px solid var(--hair); border-left:3px solid var(--accent); background:var(--surface); border-radius:6px; padding:12px 16px; font-size:13px; display:flex; flex-direction:column; gap:5px}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--warn)}
.note.crit{border-left-color:var(--crit)}
.empty{padding:22px 16px; color:var(--ink-3); font-size:13px; text-align:center}
.name-btn{appearance:none; background:none; border:none; padding:0; color:var(--ink); font-family:var(--ui); font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--accent); color:var(--accent)}
.role{font-size:11px; color:var(--ink-3); font-family:var(--ui)}

/* ---------- review queue ---------- */
.q{display:flex; flex-direction:column}
.qi{display:flex; gap:12px; align-items:flex-start; padding:11px 16px; border-bottom:1px solid var(--hair-2)}
.qi:last-child{border-bottom:none}
.qi input[type="checkbox"]{margin-top:4px; width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:0 0 16px}
.qi .b{flex:1; min-width:0}
.qi .t{font-weight:600; color:var(--ink); font-size:13.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.qi .d{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.qi .d .mono{font-family:var(--mono); font-size:12px}
.lv{font-size:9.5px; font-weight:800; letter-spacing:.08em; padding:2px 7px; border-radius:4px; text-transform:uppercase}
.lv.u{background:var(--crit); color:#fff}
.lv.i{background:var(--surface-3); color:var(--ink-2)}
.qi.locked input{visibility:hidden}

/* ---------- pay table ---------- */
.pay td{padding:10px 12px}
.pay input[type="checkbox"]{width:18px; height:18px; accent-color:var(--good); cursor:pointer; vertical-align:middle}
.pay .owed{font-size:16px; font-weight:600}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(20,10,12,.45); display:none; z-index:40}
.scrim.on{display:block}
.drawer{position:fixed; top:0; right:0; height:100vh; width:min(720px,100vw); background:var(--surface); border-left:1px solid var(--hair); box-shadow:-12px 0 40px -20px rgba(0,0,0,.5); z-index:50; transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column}
.drawer.on{transform:none}
.drawer-head{padding:18px 20px 14px; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.drawer-head h2{font-family:var(--display); font-size:22px; color:var(--ink); font-weight:600; line-height:1.1}
.drawer-head .sub{font-size:12.5px; color:var(--ink-3); margin-top:3px}
.drawer-body{overflow:auto; flex:1}
.drawer-body table{min-width:0; font-size:12px}
.drawer-body td,.drawer-body th{padding:7px 9px}
.drawer-foot{padding:14px 20px; border-top:1px solid var(--hair); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.x{appearance:none; border:none; background:var(--surface-2); color:var(--ink-2); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px}
.sec{padding:10px 20px 4px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--surface); border:1px solid var(--hair); border-radius:10px; width:min(480px,100%); box-shadow:var(--shadow); overflow:hidden}
.modal .bh{padding:16px 20px 10px}
.modal h3{font-family:var(--display); font-size:20px; color:var(--ink); font-weight:600}
.modal .bb{padding:0 20px 16px; font-size:13.5px; display:flex; flex-direction:column; gap:10px}
.modal label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; flex-direction:column; gap:4px}
.modal .bf{padding:12px 20px; border-top:1px solid var(--hair); display:flex; justify-content:flex-end; gap:8px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.kv b{color:var(--ink-3); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em}
.err{color:var(--crit); font-size:12.5px}

/* ---------- gate ---------- */
.gate{position:fixed; inset:0; background:var(--ground); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px}
.gate .box{width:min(380px,100%); background:var(--surface); border:1px solid var(--hair); border-radius:10px; padding:26px 26px 22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px}
.gate h1{font-family:var(--display); font-size:24px; color:var(--ink); font-weight:600}
.gate p{font-size:13px; color:var(--ink-3)}
.gate input{font-size:15px; padding:10px 12px}

/* ---------- misc ---------- */
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:8px; font-size:13px; z-index:70; display:none; max-width:90vw}
.toast.on{display:block}
.filters{display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--hair); background:var(--surface-2)}
.filters select,.filters input{font-size:12.5px; padding:6px 9px}
.skel{height:14px; background:var(--surface-3); border-radius:4px; animation:sk 1.2s infinite}
@keyframes sk{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel{animation:none} .drawer{transition:none}}
.menu-btn{display:none}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%; flex:none; height:auto; position:static}
  .nav{flex-direction:row; overflow-x:auto; padding:8px 10px}
  .nav button{white-space:nowrap; width:auto}
  .side-foot{display:none}
  .main{padding:18px 14px 50px}
  .topbar h1{font-size:24px}
}
.qi .d ol.steps{margin:6px 0 8px 18px; padding:0; display:flex; flex-direction:column; gap:4px}
.qi .d ol.steps li{padding-left:2px}
.qi .d .btn{margin-top:2px}
label>input[type=password]{width:100%; margin-top:4px; padding:8px 10px; border:1px solid var(--hair); border-radius:6px; background:var(--surface); color:var(--ink); font:inherit}
@media print{.side,.ctl,.scrim,.drawer,.toast{display:none!important} .main{padding:0}}
</style>
</head>
<body>

<div class="shell" id="shell">
  <aside class="side">
    <div class="brand">
      <div class="k">She Creates Academy</div>
      <div class="t">Commission HQ</div>
    </div>
    <nav class="nav" aria-label="Sections">
      <button id="nav-pay" data-page="pay" aria-current="page"><span class="ic">01</span>Pay Period<span class="cnt" id="cnt-pay" hidden></span></button>
      <button id="nav-l1" data-page="l1"><span class="ic">02</span>Ledger 1 · Deals<span class="cnt" id="cnt-l1" hidden></span></button>
      <button id="nav-l2" data-page="l2"><span class="ic">03</span>Ledger 2 · Payouts<span class="cnt" id="cnt-l2" hidden></span></button>
    </nav>
    <div class="side-foot">
      <div id="sf-status"><span class="dot"></span>Loading</div>
      <div id="sf-fetched"></div>
      <div id="sf-write"></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pg-title">Pay Period</h1>
        <div class="sub" id="pg-sub"></div>
      </div>
      <div class="ctl" id="pg-ctl"></div>
    </div>
    <section class="stack" id="page-pay"></section>
    <section class="stack" id="page-l1" hidden></section>
    <section class="stack" id="page-l2" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><h2 id="dr-title"></h2><div class="sub" id="dr-sub"></div></div>
    <button class="x" id="dr-close" aria-label="Close">×</button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
  <div class="drawer-foot" id="dr-foot"></div>
</aside>

<div class="modal" id="modal"><div class="box">
  <div class="bh"><h3 id="md-title"></h3></div>
  <div class="bb" id="md-body"></div>
  <div class="bf"><button class="btn" id="md-cancel">Cancel</button><button class="btn primary" id="md-ok">Confirm</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   SCA Commission HQ  v3  (2026-08-30)
   No spreadsheet anywhere. The page asks the Apps Script API (hq-api.gs) for
   { feeds, state }: feeds = Whop payments/memberships/plans, GHL events/users/
   contacts, End of Call Report form responses; state = payouts, dismissals,
   manual matches, settings (hq-config.json) and the frozen pre-8/26 End-of-Call
   history (hq-legacy.json), all from Patrick's private Drive folder.
   The whole page is behind one shared admin password (checked here by hash,
   and again by the API on every call).
   ===================================================================== */

const CFG = {
  API: "https://script.google.com/macros/s/AKfycbxzeYqOdDvu2m-iRU3Jx7qjSoHVzjSdLSgrbP_6dZZBTh0Z-z_W9zA3blEGXUp3O7pn/exec",   /* Apps Script web app /exec URL. Empty = the page cannot load. */
  /* No password hash lives here on purpose. This repo is PUBLIC, so a hash would be
     crackable offline and it IS the API token. The only check is server-side: the page
     sends what you type and the API accepts or rejects it against HQ_TOKEN.
     Settings and deal history come from the API too, so this file holds no client data. */
  REVIEW_WINDOW_DAYS: 60
};

/* ---------------- state ---------------- */
const S = { F:null, ST:{payouts:[],dismissed:[],matches:[],log:[]}, C:{}, legacy:[], errors:[],
            dealRows:[], lines:[], people:{}, reviews:[], orphanCycles:[], fromD:null, toD:null, fetched:null, page:"pay", token:"" };

/* ---------------- helpers ---------------- */
const has = v => v !== null && v !== undefined && v !== "";
const normName = s => String(s||"").trim().toUpperCase();
const firstName = s => normName(String(s||"").trim().split(/\s+/)[0]);
const ARTIFACT = /^\(UNASSIGNED\)$|^NONE$|^N\/A$|^-+$|^SELF/i;
const isPerson = s => has(s) && !ARTIFACT.test(normName(s));
const squash = s => String(s||"").toLowerCase().replace(/[^a-z]/g,"");
function lev(a, b){ if(a === b) return 0; const m = a.length, n = b.length; if(!m || !n) return m + n; let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i = 1; i <= m; i++){ const cur = [i]; for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; } return prev[n]; }
/* "Teena Walekr" ~ "Teena Walker", "Char Dalton" ~ "Charlesia Dalton", "Yvonne Figueroa solario" ~ "Yvonne Solorio"; NOT "Gabriela Rodriguez" ~ "Gabriela Sandoval" */
function nameLike(a, b){ const A = squash(a), B = squash(b); if(!A || !B) return false; if(A === B) return true;
  const pa = String(a).trim().toLowerCase().split(/\s+/).map(squash).filter(Boolean), pb = String(b).trim().toLowerCase().split(/\s+/).map(squash).filter(Boolean);
  if(!pa.length || !pb.length) return false;
  const fa = pa[0], fb = pb[0], firstOk = fa.length >= 3 && fb.length >= 3 && (fa === fb || fa.startsWith(fb) || fb.startsWith(fa) || lev(fa, fb) <= 1);
  if(!firstOk) return false;
  const la = pa.slice(1), lb = pb.slice(1); if(!la.length || !lb.length) return true;
  return la.some(x => lb.some(y => x === y || (x.length >= 4 && y.length >= 4 && (x.startsWith(y) || y.startsWith(x) || lev(x, y) <= 2)))); }
/* GHL and Whop store names lowercase; show them capitalised without mangling names typed with capitals */
const nice = s => { const t = String(s||""); return /[A-Z]/.test(t) ? t : title(t); };
const money = v => (v === null || v === undefined || !isFinite(v)) ? "—" : (v < 0 ? "-" : "") + "$" + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: (Math.round(Math.abs(v)*100)%100) ? 2 : 0, maximumFractionDigits:2});
const num = v => (v === null || v === undefined || !isFinite(v)) ? "—" : Math.round(v).toLocaleString("en-US");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = iso => { const p = String(iso||"").split("-"); return p.length === 3 ? MON[+p[1]-1] + " " + (+p[2]) : String(iso||"—"); };
const fmtDY = iso => { const p = String(iso||"").split("-"); return p.length === 3 ? MON[+p[1]-1] + " " + (+p[2]) + ", " + p[0] : String(iso||"—"); };
const title = s => String(s||"").toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayShift = (iso, d) => { const p = String(iso).split("-"); if(p.length !== 3) return iso; const t = new Date(Date.UTC(+p[0], +p[1]-1, +p[2] + d)); return t.toISOString().slice(0,10); };
const PT = { timeZone:"America/Los_Angeles" };
const ptDate = x => { if(!x) return ""; const d = typeof x === "number" ? new Date(x * (x < 1e12 ? 1000 : 1)) : new Date(x); return isNaN(d) ? "" : d.toLocaleDateString("en-CA", PT); };
const todayISO = () => new Date().toLocaleDateString("en-CA", PT);
const thuWeek = iso => { const p = String(iso).split("-"); if(p.length !== 3) return iso; const t = new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); const back = (t.getUTCDay() - 4 + 7) % 7; t.setUTCDate(t.getUTCDate() - back); return t.toISOString().slice(0,10); };
const inRange = d => { const x = String(d||""); return x >= S.fromD && x <= S.toD; };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const r2 = x => Math.round(x * 100) / 100;

/* ---------------- load ---------------- */
async function api(params, post){
  if(!CFG.API || /__API_URL__/.test(CFG.API)) throw new Error("The API URL is not set (CFG.API in index.html). Deploy hq-api.gs as a web app and paste its /exec URL.");
  let res, txt;
  try {
    if(post) res = await fetch(CFG.API, { method:"POST", body: JSON.stringify(Object.assign({ token:S.token }, post)), headers:{ "Content-Type":"text/plain;charset=utf-8" }, redirect:"follow" });
    else res = await fetch(CFG.API + "?" + new URLSearchParams(Object.assign({ token:S.token }, params)).toString(), { redirect:"follow" });
    txt = await res.text();
  } catch(e){ throw new Error("Could not reach the API: " + e.message); }
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error("The API returned something that is not JSON (HTTP " + res.status + "). Is the web app deployed as Execute as Me / Anyone?"); }
  if(!j.ok){ if(/bad token/.test(j.error || "")){ try { localStorage.removeItem("hq.tok"); } catch(_){} S.token = ""; } throw new Error(j.error || "API error"); }
  return j;
}
async function load(opts){
  const j = await api(opts && opts.refresh ? { action:"refresh" } : { action:"data" });
  S.F = j.feeds; S.ST = j.state || S.ST; S.C = j.config || {}; S.legacy = j.legacy || []; S.fetched = new Date();
  if(!S.C.roster) throw new Error("The API answered but sent no settings. Re-push hq-api.gs (its CONFIG block is empty).");
  compute(); renderAll();
}

/* ======================= MODEL ======================= */
function rosterFor(name){ const r = (S.C.roster || []).find(x => normName(x.name) === name); return r ? Object.assign({ onRoster:true }, r) : null; }
const isCloser = n => { const ro = rosterFor(n); return !!ro && /closer/i.test(ro.role || ""); };

function compute(){
  const F = S.F, C = S.C, today = todayISO();
  const PAID_THROUGH0 = C.paidThrough || "", DEALS_FROM = C.dealsFrom || "2026-07-01", FLAT_FROM = C.flatFrom || "2026-08-27", WIN = C.matchWindowDays || 3;
  const rateFor = (closer, formRate) => { if(/15/.test(String(formRate||""))) return C.selfBookedRate || 0.15; const ro = rosterFor(closer); return ro && ro.closerRate ? ro.closerRate : (C.closerRate || 0.10); };
  const setterFlat = setter => { const ro = rosterFor(setter); return ro && ro.close ? ro.close : (C.setterClose || 50); };
  const people = {}, lines = [];
  const P = name => { if(!people[name]) people[name] = { name, roster: rosterFor(name), roles:{}, lines:[] }; return people[name]; };

  /* ---- GHL: users, contacts, events ---- */
  const userName = {}; (F.users || []).forEach(u => userName[u.id] = u.name || u.email || u.id);
  const contacts = F.contacts || {}, byEmail = F.byEmail || {}, byName = F.byName || {};
  const ignore = new Set((C.ignoreCalendars || []).map(squash));
  const evByContact = {};
  (F.events || []).forEach(e => { if(ignore.has(squash(e.cal))) return; const a = { id:e.id, date: ptDate(e.start), status:e.status, cal:e.cal, contactId:e.contactId, rep: firstName(userName[e.userId] || ""), userId:e.userId };
    if(!a.date || !a.contactId) return; (evByContact[a.contactId] = evByContact[a.contactId] || []).push(a); });
  /* the call that produced a payment: latest non-cancelled call run by a roster CLOSER, on/before the payment (+1 day slop), within 60 days */
  const callFor = (ids, paidDate) => { const list = [].concat(...(ids || []).map(id => evByContact[id] || []));
    const live = list.filter(a => !/cancel/.test(a.status) && isCloser(a.rep) && a.date <= dayShift(paidDate, 1) && daysBetween(a.date, paidDate) <= 60).sort((x,y) => x.date < y.date ? 1 : -1);
    return live[0] || null; };
  const otherRepOn = (ids, paidDate) => { const list = [].concat(...(ids || []).map(id => evByContact[id] || [])); /* a non-closer ran the call (setter's calendar, admin) */
    return list.filter(a => !/cancel/.test(a.status) && isPerson(a.rep) && !isCloser(a.rep) && a.date <= dayShift(paidDate, 1) && daysBetween(a.date, paidDate) <= 60).sort((x,y) => x.date < y.date ? 1 : -1)[0] || null; };
  const contactName = ids => { for(const id of ids || []){ const c = contacts[id]; if(c && c.name) return c.name; } return ""; };

  /* ---- End of Call forms: live form responses + the frozen pre-8/26 snapshot ---- */
  const eocs = [].concat((F.eoc || []).map(e => ({ src:"form", id:e.id, date:String(e.date||"").slice(0,10), prospect:e.prospect, closer:firstName(e.closer), setter: isPerson(e.setter) ? firstName(e.setter) : "", outcome:e.outcome, closed:/^closed/i.test(e.outcome), cash:+e.cash || 0, contract:+e.contract || 0, rate:e.rate || "", used:false })),
                         (S.legacy || []).map((e, i) => ({ src:"legacy", id:"L" + i, date:e.date, prospect:e.prospect, closer:firstName(e.closer), setter: isPerson(e.setter) ? firstName(e.setter) : "", outcome:e.outcome, closed:e.cash > 0, cash:+e.cash || 0, contract:+e.contract || 0, rate:"", used:false })))
    .filter(e => e.prospect && /^\d{4}-\d\d-\d\d$/.test(e.date));
  /* the call can sit up to 7 days BEFORE the payment (plans get paid a few days later) or WIN days after it */
  const near = (e, date) => daysBetween(e.date, date) >= -WIN && daysBetween(e.date, date) <= 7;
  const findEoc = (names, amount, date) => eocs.find(e => !e.used && e.closed && Math.abs(e.cash - amount) < 1 && near(e, date) && names.some(n => nameLike(n, e.prospect)))
                                        || eocs.find(e => !e.used && e.closed && near(e, date) && names.some(n => nameLike(n, e.prospect))) || null;

  /* ---- manual matches ---- */
  const manual = {}; (S.ST.matches || []).forEach(m => { manual[m.paymentId] = m; });

  /* ---- Whop: plans, memberships, payments ---- */
  const plans = {}; (F.plans || []).forEach(p => plans[p.id] = p);
  const mems = {}; (F.memberships || []).forEach(m => mems[m.id] = m);
  /* Whop returns prices as strings ("500.0"); coerce or + concatenates */
  const contracted = m => { const pl = m ? plans[m.plan] : null; if(!pl) return null;
    const init = +pl.initial || 0, ren = +pl.renewal || 0;
    if(pl.type === "one_time") return init || null;
    const split = +m.split || +pl.split || 0; return split ? init + split * ren : null; };
  const paid = (F.payments || []).filter(p => p.status === "paid" && +p.amount > 0).map(p => Object.assign({}, p, { amount:+p.amount, refunded:+p.refunded || 0, date: ptDate(p.paidAt || p.createdAt) })).filter(p => p.date);
  const isCycle = p => p.reason === "subscription_cycle";
  const paidByMem = {}; paid.forEach(p => { if(p.membership) (paidByMem[p.membership] = paidByMem[p.membership] || []).push(p); });
  const failed = (F.payments || []).filter(p => p.status !== "paid" && p.failure).map(p => Object.assign({}, p, { date: ptDate(p.createdAt) }));

  /* ---- Deals: one per upfront paid Whop payment ---- */
  const upfront = paid.filter(p => !isCycle(p) && p.date >= DEALS_FROM).sort((a,b) => a.date < b.date ? -1 : 1);
  S.dealRows = [];
  upfront.forEach(p => {
    const pid = p.id, date = p.date, email = p.email, m = mems[p.membership] || null, pl = m ? plans[m.plan] : plans[p.plan];
    const names = [p.name].filter(n => n && n.length >= 3);
    let closer = "", setter = "", tier = "", appt = null, ids = [], ghlName = "", note = ""; const flags = [];
    /* 0. a human already answered */
    const mm = manual[pid];
    if(mm && isPerson(mm.closer)){ closer = mm.closer; setter = mm.setter; tier = "confirmed"; ids = mm.contactId ? [mm.contactId] : (byEmail[email] || []); ghlName = contactName(ids); }
    /* 1. email: Whop email -> GHL contact -> the appointment -> Assigned User */
    if(!closer && email && (byEmail[email] || []).length){ ids = byEmail[email]; ghlName = contactName(ids); appt = callFor(ids, date); if(appt){ closer = appt.rep; tier = "email"; } }
    /* 2. name: Whop billing name -> GHL contact (exact name) -> the appointment */
    if(!closer && (byName[squash(p.name)] || []).length){ const nid = byName[squash(p.name)]; const a = callFor(nid, date); if(a){ ids = nid; ghlName = ghlName || contactName(nid); appt = a; closer = a.rep; tier = "name"; } }
    if(ghlName) names.push(ghlName);
    /* 3. the End of Call form: the setter always; the closer when the calendar had no answer */
    const eoc = findEoc(names, p.amount, date);
    if(eoc){ eoc.used = true;
      if(!closer && isPerson(eoc.closer)){ closer = eoc.closer; tier = "form"; }
      else if(closer && isPerson(eoc.closer) && eoc.closer !== closer && tier !== "confirmed") flags.push({ kind:"closer-mismatch", form:eoc.closer, src:eoc.src });
      if(isPerson(eoc.setter)) setter = eoc.setter; }
    else if(isPerson(closer)) flags.push({ kind:"no-form" });
    /* 4. nobody: build a suggestion from timing so the human just verifies */
    let suggestion = null;
    if(!closer){
      const other = otherRepOn(ids, date);
      const fn0 = squash(String(p.name).split(/\s+/)[0]);
      const score = e => (fn0 && fn0.length >= 3 && squash(String(e.prospect).split(/\s+/)[0]) === fn0 ? 0 : 1) * 4 + (Math.abs(e.cash - p.amount) < 1 ? 0 : 2) + Math.min(Math.abs(daysBetween(e.date, date)), 1);
      const cands = eocs.filter(e => !e.used && e.closed && isPerson(e.closer) && Math.abs(daysBetween(e.date, date)) <= WIN).sort((a,b) => score(a) - score(b));
      suggestion = { forms: cands.filter(e => score(e) < 6).slice(0,3), other, ghlName };   /* first name or same amount, never a random neighbour */
      flags.push({ kind:"unmatched" }); }
    const prospect = nice(ghlName || (eoc && eoc.prospect) || p.name || email);
    const total = contracted(m), memPaid = (paidByMem[p.membership] || []).filter(x => x.date >= date);
    const planish = p.reason === "subscription_create" || (pl && pl.type === "renewal");
    const payType = planish ? (total ? "Plan" : "Plan (open)") : "Upfront";
    const key = "W|" + pid;
    const d = { i:S.dealRows.length, key, pid, date, week:thuWeek(date), prospect, ghlName, whopName:p.name, email, closer, setter, tier, appt, eoc, flags, suggestion, contactId: ids[0] || "",
      cash:p.amount, refunded:p.refunded || 0, payType, contract: total || p.amount, collected:p.amount, remaining: total ? Math.max(total - p.amount, 0) : null, installments:0, lastPayment:date, membership:p.membership, plan: pl ? pl.name : "",
      closerComm:0, setterComm:0, lines:[], source:"whop", formRate: eoc ? eoc.rate : "" };
    if(isPerson(closer)){ d.closerComm = r2(p.amount * rateFor(closer, d.formRate));
      const L = { id:key+"|C", person:closer, role:"Closer", amount:d.closerComm, dealKey:key, date, prospect, cash:p.amount, kind:"close" }; lines.push(L); d.lines.push(L); P(closer).roles.Closer = 1;
      if(isPerson(setter)){ d.setterComm = date >= FLAT_FROM ? setterFlat(setter) : r2(p.amount * (C.setterRateBefore || 0.05));
        const SL = { id:key+"|S", person:setter, role:"Setter", amount:d.setterComm, dealKey:key, date, prospect, cash:p.amount, kind: date >= FLAT_FROM ? "set-close" : "set-pct" }; lines.push(SL); d.lines.push(SL); P(setter).roles.Setter = 1; } }
    S.dealRows.push(d);
  });

  /* ---- Installments: a later payment on the SAME Whop membership pays that deal's closer as it lands ---- */
  const dealByMem = {}; S.dealRows.forEach(d => { if(d.membership) dealByMem[d.membership] = d; });
  S.orphanCycles = [];
  paid.filter(isCycle).sort((a,b) => a.date < b.date ? -1 : 1).forEach(p => {
    if(p.date < DEALS_FROM) return;
    let d = dealByMem[p.membership] || null, closer = d ? d.closer : "", tier = d ? d.tier : "";
    if(!isPerson(closer)){ const mm = manual[p.id]; if(mm && isPerson(mm.closer)){ closer = mm.closer; tier = "confirmed"; } }
    if(d){ d.installments++; d.collected += p.amount; if(d.remaining !== null) d.remaining = Math.max(d.contract - d.collected, 0); if(p.date > d.lastPayment) d.lastPayment = p.date; }
    if(!isPerson(closer)){ S.orphanCycles.push({ pid:p.id, date:p.date, amount:p.amount, name:p.name, email:p.email, legacy: !d }); return; }
    if(!d){ /* plan that started before Deals from: its own row so the money is visible */
      const m = mems[p.membership], pl = m ? plans[m.plan] : null;
      d = { i:S.dealRows.length, key:"W|" + p.id, pid:p.id, date:p.date, week:thuWeek(p.date), prospect:nice(p.name || p.email), ghlName:"", whopName:p.name, email:p.email, closer, setter:"", tier, appt:null, eoc:null, flags:[], suggestion:null, contactId:"",
        cash:p.amount, refunded:p.refunded || 0, payType:"Plan", contract: contracted(m) || p.amount, collected:p.amount, remaining:null, installments:0, lastPayment:p.date, membership:p.membership, plan: pl ? pl.name : "", closerComm:0, setterComm:0, lines:[], source:"whop", instOnly:true };
      S.dealRows.push(d); dealByMem[p.membership] = d; }
    const a = r2(p.amount * rateFor(closer, d.formRate));
    const L = { id:"I|" + p.id + "|C", person:closer, role:"Closer", amount:a, dealKey:d.key, date:p.date, prospect:d.prospect, cash:p.amount, kind:"installment", pid:p.id }; lines.push(L); d.lines.push(L); P(closer).roles.Closer = 1;
    if(d.instOnly) d.closerComm += a;
  });

  /* ---- Forms that closed with no Whop money behind them ---- */
  S.formOnly = eocs.filter(e => !e.used && e.closed && e.cash > 0 && e.date >= DEALS_FROM && !(e.src === "legacy" && PAID_THROUGH0 && e.date <= PAID_THROUGH0)).map(e => {
    const attempts = failed.filter(f => Math.abs(daysBetween(f.date, e.date)) <= WIN && nameLike(f.name, e.prospect));
    return Object.assign({ attempts, pending: daysBetween(e.date, today) <= 4 }, e); });

  /* ---- Paid state ---- */
  const PAID_THROUGH = C.paidThrough || ""; S.paidThrough = PAID_THROUGH;
  lines.forEach(L => { L.paid = false; L.payout = null; });
  if(/^\d{4}-\d\d-\d\d$/.test(PAID_THROUGH)) lines.filter(L => L.date <= PAID_THROUGH).forEach(L => { L.paid = true; L.payout = { id:"Historical", datePaid:PAID_THROUGH, paidBy:"", source:"through" }; });
  const byId = {}; lines.forEach(L => byId[L.id] = L);
  const live = (S.ST.payouts || []).filter(p => !p.voided);
  live.forEach(p => (p.lines || []).forEach(id => { if(byId[id] && !byId[id].paid){ byId[id].paid = true; byId[id].payout = p; } }));
  live.filter(p => !(p.lines || []).length).forEach(p => { let left = +p.amount || 0; lines.filter(L => L.person === p.person && !L.paid).sort((a,b) => a.date < b.date ? -1 : 1).forEach(L => { if(left >= L.amount - 0.005 && L.amount > 0){ left -= L.amount; L.paid = true; L.payout = p; } }); });

  lines.forEach(L => P(L.person).lines.push(L));
  S.lines = lines; S.people = people;
  S.dealRows.forEach(d => { d.closerPaid = d.lines.some(L => L.role === "Closer" && L.paid); d.setterPaid = d.lines.some(L => L.role === "Setter" && L.paid); });
  if(!S.fromD){ const r = presetRange("payout"); S.fromD = r[0]; S.toD = r[1]; }
  S.reviews = buildReviews();
}

function personSummary(p){
  const unpaid = p.lines.filter(L => !L.paid), paid = p.lines.filter(L => L.paid);
  const periodLines = unpaid.filter(L => inRange(L.date)), outside = unpaid.filter(L => !inRange(L.date));
  const sum = a => a.reduce((s,L) => s + L.amount, 0);
  return { owed:sum(unpaid), owedPeriod:sum(periodLines), owedOutside:sum(outside), periodLines, outside, unpaid, paid, earnedAll:sum(p.lines), paidAll:sum(paid) };
}

/* ---------------- review rules: every item says exactly what to do ---------------- */
function buildReviews(){
  const out = [], today = todayISO(), cutoff = dayShift(today, -CFG.REVIEW_WINDOW_DAYS), F = S.F;
  const dismissed = new Set((S.ST.dismissed || []).map(r => r.id));
  const add = (id, level, ttl, steps, opts) => out.push(Object.assign({ id, level, title:ttl, steps, dismissed: dismissed.has(id) }, opts || {}));
  const whopLink = pid => '<a href="https://whop.com/dashboard/' + esc(S.C.whopBizId || "") + '/payments/" target="_blank" rel="noopener">open Whop payments</a> (search the email; payment ' + esc(pid) + ')';
  const who = d => '<b>' + esc(d.prospect) + '</b>' + (d.email ? ' <span class="mono">' + esc(d.email) + '</span>' : '');

  /* feed health (locked = cannot be dismissed, fixes itself when the feed is back) */
  (F.errors || []).forEach((e, i) => add("feed|error|" + i, "U", "A data source did not answer: " + e.split(":")[0], ["The API kept the last good copy of that source, so the numbers below may be behind.", "Patrick: open the Apps Script (SCA Commission HQ API) → Executions to see the error. Usual causes: an expired key, or GHL's auth timing out (retry).", "Once it pulls again this item disappears by itself."], {locked:true}));
  if(F.refreshedAt){ const ageH = (Date.now() - Date.parse(F.refreshedAt)) / 36e5;
    if(ageH > (S.C.staleHours || 2)) add("feed|stale|" + F.refreshedAt.slice(0,13), "U", "Data is " + (ageH < 48 ? Math.round(ageH) + " hours" : Math.round(ageH/24) + " days") + " old", ["Click <b>Refresh</b> at the top of this page. If the time in the sidebar does not move, the 15-minute trigger in the Apps Script has stopped.", "Patrick: run <span class=\"mono\">installTriggers()</span> in the SCA Commission HQ API script."], {locked:true}); }
  if(F.contactBacklog) add("feed|backlog", "I", "Still looking up customer names in GHL", ["The API looks up " + (F.contactFetches || "") + " GHL contacts per run and has more to do. Some deals may show the Whop name and \"nobody\" for a few refreshes.", "Nothing to do. Check back after the next refresh (15 min)."], {locked:true});
  if(!(F.eoc || []).length) add("feed|no-eoc", "I", "No End of Call Report responses came through", ["The form (End of Call Report) returned zero responses, so no setters can be named on new deals.", "Patrick: confirm EOC_FORM_ID in the script's properties points at the live form and that the account running the script owns it."], {locked:true});

  /* per-deal */
  const recent = S.dealRows.filter(d => d.date >= cutoff && !d.instOnly);
  recent.forEach(d => d.flags.forEach(f => {
    if(f.kind === "unmatched"){
      const sg = d.suggestion || {}, f0 = sg.forms && sg.forms[0];
      const historical = S.paidThrough && d.date <= S.paidThrough;
      const steps = ["Whop received " + money(d.cash) + " on " + fmtDY(d.date) + " from " + who(d) + ". That email is not on a GHL contact who had a call with a closer, and no End of Call form matches the name."];
      if(f0) steps.push("<b>Most likely:</b> " + esc(title(f0.closer)) + " filed an End of Call form for <b>" + esc(f0.prospect) + "</b> on " + fmtD(f0.date) + (Math.abs(f0.cash - d.cash) < 1 ? " for the same " + money(f0.cash) : " for " + money(f0.cash)) + (f0.setter ? ", set by " + esc(title(f0.setter)) : "") + ". Same person paying under a different name or email?");
      if(sg.other) steps.push("Note: " + esc(title(sg.other.rep)) + " (not a closer) ran a call with this contact on " + fmtD(sg.other.date) + ".");
      steps.push("Check: " + whopLink(d.pid) + " and compare the name and email with the form" + (f0 ? "" : ", or ask the closers who took this one") + ".");
      if(!f0) steps.splice(1, 0, "No End of Call form within " + (S.C.matchWindowDays || 3) + " days shares her first name or this amount, so there is nothing to pre-fill.");
      steps.push("Then click <b>" + (f0 ? "Confirm" : "Assign") + "</b>, pick the closer" + (f0 ? " (pre-filled)" : "") + " and the setter, and save. The commission lines appear the moment you do." + (historical ? " This one is dated before " + fmtD(S.paidThrough) + ", so it already counts as paid; naming the closer just fixes the record." : " Until then nobody is paid on it."));
      add("unmatched|" + d.pid, historical ? "I" : (d.cash >= 497 ? "U" : "I"), money(d.cash) + " from " + d.prospect + ": nobody is assigned", steps, { kind:"unmatched", dealKey:d.key, pid:d.pid, suggestion:f0 || null, action: f0 ? "Confirm" : "Assign" });
    }
    if(f.kind === "closer-mismatch")
      add("closer-mismatch|" + d.pid, "U", d.prospect + ": calendar says " + title(d.closer) + ", the End of Call form says " + title(f.form),
        [money(d.cash) + " paid " + fmtDY(d.date) + ". The GHL appointment was run by <b>" + esc(title(d.closer)) + "</b>; the End of Call form" + (f.src === "legacy" ? " (old Cash Log)" : "") + " names <b>" + esc(title(f.form)) + "</b>. Right now <b>" + esc(title(d.closer)) + "</b> is being paid.",
         "Ask the two closers, or open the Fathom recording from the form, and decide who actually closed her.",
         "If the form is right: click <b>Reassign</b>, pick " + esc(title(f.form)) + ", save. If the calendar is right: tick this item to dismiss it."], { kind:"mismatch", dealKey:d.key, pid:d.pid, action:"Reassign", closer:d.closer, setter:d.setter });
    if(f.kind === "no-form" && d.date >= (S.C.flatFrom || "2026-08-27"))
      add("no-form|" + d.pid, "I", money(d.cash) + " from " + d.prospect + ": no End of Call form",
        ["Closer <b>" + esc(title(d.closer)) + "</b> came from the GHL calendar and is being paid. No End of Call form matched, so <b>no setter</b> is paid on this deal.",

function presetRange(v){
  const t = todayISO(), cur = thuWeek(t), ym = t.slice(0,7);
  const monthEnd = ym => { const p = ym.split("-"); return new Date(Date.UTC(+p[0], +p[1], 0)).toISOString().slice(0,10); };
  const prevYm = ym => { const p = ym.split("-"); return new Date(Date.UTC(+p[0], +p[1]-2, 1)).toISOString().slice(0,7); };
  switch(v){
    /* Payout week: Fri–Thu (7 days, so a Friday payment always belongs to a period), paid the following Friday.
       "payout" = the week containing today (closes this coming Thursday); "payout-prev" = the last closed one. */
    case "payout": { const end = cur === t ? cur : dayShift(cur, 7); return [dayShift(end, -6), end]; }
    case "payout-prev": { const end = cur === t ? cur : dayShift(cur, 7); return [dayShift(end, -13), dayShift(end, -7)]; }
    case "since-paid": return [dayShift(S.paidThrough || t, 1), t];
    case "this-month": return [ym + "-01", monthEnd(ym)];
    case "last-month": { const q = prevYm(ym); return [q + "-01", monthEnd(q)]; }
    case "30": return [dayShift(t, -29), t];
    case "all": { const ds = S.dealRows.map(d => d.date).concat(S.lines.map(L => L.date)).filter(x => /^\d{4}-\d\d-\d\d$/.test(x)).sort(); return [ds[0] || t, t]; }
    default: return null;
  }
}

  document.getElementById("pg-ctl").innerHTML = '<button class="btn" id="csv1">Download CSV</button>';
  const people = Object.keys(S.people).sort();
  let rows = S.dealRows.filter(d => (!L1.person || d.closer === L1.person || d.setter === L1.person) && (!L1.q || (d.prospect + " " + d.whopName + " " + d.closer + " " + d.setter + " " + d.email + " " + d.pid).toLowerCase().includes(L1.q.toLowerCase())));
  const keyf = { date:d => d.date, prospect:d => d.prospect.toLowerCase(), cash:d => d.cash, closer:d => d.closer, setter:d => d.setter }[L1.sort] || (d => d.date);
  rows.sort((a,b) => { const x = keyf(a), y = keyf(b); return (x < y ? -1 : x > y ? 1 : 0) * (L1.dir === "asc" ? 1 : -1); });
  const total = rows.reduce((s,d) => s + d.collected, 0);
  const th = (label, key, left) => '<th class="sort ' + (left ? "l" : "") + '" data-key="' + key + '"' + (L1.sort === key ? ' data-dir="' + L1.dir + '"' : '') + '>' + label + '</th>';
  let h = '<div class="panel"><div class="panel-head"><span>Deals</span><span class="r">' + num(rows.length) + ' of ' + num(S.dealRows.length) + ' · ' + money(total) + ' collected</span></div>' +
    '<div class="filters"><input type="search" id="f-q" placeholder="Search customer, rep, email, payment id" value="' + esc(L1.q) + '">' +
    '<select id="f-person"><option value="">All reps</option>' + people.map(p => '<option value="' + esc(p) + '"' + (L1.person === p ? ' selected' : '') + '>' + esc(title(p)) + '</option>').join("") + '</select></div>' +
    '<div class="tw"><table><thead><tr>' + th("Date","date") + th("Customer","prospect",1) + th("Collected","cash") + '<th>Paid to date</th><th>Remaining</th><th class="l">Pay type</th><th>Payment</th><th>Match</th>' + th("Closer","closer",1) + '<th>Closer comm</th><th>Paid?</th>' + th("Setter","setter",1) + '<th>Setter comm</th><th>Paid?</th></tr></thead><tbody>' +
    (rows.length ? rows.map(d => '<tr>' + [esc(fmtDY(d.date)), custCell(d) + (d.whopName && squash(d.whopName) !== squash(d.prospect) ? '<div class="mute" style="font-size:11px">Whop: ' + esc(d.whopName) + '</div>' : ''), money(d.cash),
      /plan/i.test(d.payType) ? money(d.collected) + (d.installments ? ' <span class="mute">(' + (d.installments + 1) + ' pmts)</span>' : '') : "—", /plan/i.test(d.payType) && d.remaining !== null ? money(d.remaining) : "—", esc(d.payType), payPill(d), matchPill(d),
      isPerson(d.closer) ? esc(title(d.closer)) : "—", d.closerComm ? money(d.closerComm) : "—", paidPill(d.closerPaid, d.closerComm) || "—",
      isPerson(d.setter) ? esc(title(d.setter)) : "—", d.setterComm ? money(d.setterComm) : "—", paidPill(d.setterPaid, d.setterComm) || "—"]
      .map((c,i) => '<td class="' + ([1,5,8,11].includes(i) ? "l" : "") + (c === "—" ? " mute" : "") + '">' + c + '</td>').join("") + '</tr>').join("") : '<tr><td colspan="14" class="l mute" style="text-align:center;padding:18px">No deals match.</td></tr>') +
    '</tbody></table></div></div>';
  h += '<div class="note"><p><strong>Payment</strong>: <span class="pill ok">Verified</span> Whop shows the charge as paid (only paid charges appear here) · <span class="pill bad">refunded</span> Whop refunded some or all of it. <strong>Match</strong> is how the closer was found: <span class="pill ok">email</span> the Whop email is on a GHL contact who had the call · <span class="pill ok">name</span> the Whop name is · <span class="pill">EOC form</span> neither found a call, the closer’s own End of Call form named her · <span class="pill">confirmed</span> a human confirmed it in the review queue · <span class="pill bad">nobody</span> nothing matched, it is in the review queue. <strong>Paid to date / Remaining</strong> follow the subscription that is actually on Whop, whatever link the closer sent. Commission is earned on each payment as it lands.</p></div>';
  const pg = document.getElementById("page-l1"); pg.innerHTML = h;
  document.getElementById("f-q").oninput = e => { L1.q = e.target.value; renderL1(); const i = document.getElementById("f-q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  document.getElementById("f-person").onchange = e => { L1.person = e.target.value; renderL1(); };
  pg.querySelectorAll("th.sort").forEach(t => t.onclick = () => { const k = t.dataset.key; if(L1.sort === k) L1.dir = L1.dir === "asc" ? "desc" : "asc"; else { L1.sort = k; L1.dir = k === "date" || k === "cash" ? "desc" : "asc"; } renderL1(); });
  document.getElementById("csv1").onclick = () => downloadCSV("sca-deals-" + todayISO() + ".csv", [["Date","Customer (GHL)","Whop name","Email","Collected","Paid to date","Contracted","Remaining","Pay type","Payment","Match","Whop payment id","Closer","Closer commission","Closer paid","Setter","Setter commission","Setter paid"]].concat(rows.map(d => [d.date, d.prospect, d.whopName, d.email, d.cash, d.collected, d.contract, d.remaining ?? "", d.payType, d.refunded > 0 ? "refunded " + d.refunded : "verified", d.tier || "nobody", d.pid, title(d.closer), d.closerComm, d.closerPaid ? "yes" : "no", isPerson(d.setter) ? title(d.setter) : "", d.setterComm, d.setterPaid ? "yes" : "no"])));
}

/* ----- Ledger 2 ----- */
function renderL2(){
  document.getElementById("pg-title").textContent = "Ledger 2 · Payouts";
  const all = S.ST.payouts || [], live = all.filter(p => !p.voided), voided = all.filter(p => p.voided);
  const hist = S.lines.filter(L => L.paid && L.payout && L.payout.source === "through");
  const histBy = {}; hist.forEach(L => histBy[L.person] = (histBy[L.person] || 0) + L.amount);
  const total = live.reduce((s,p) => s + (+p.amount || 0), 0) + hist.reduce((s,L) => s + L.amount, 0);
  document.getElementById("pg-sub").textContent = num(live.length) + " payout" + (live.length === 1 ? "" : "s") + " logged · " + money(total) + " paid to the sales team since " + fmtD(S.C.dealsFrom) + (voided.length ? " · " + voided.length + " voided" : "");
  document.getElementById("pg-ctl").innerHTML = '<button class="btn" id="csv2">Download CSV</button>';
  const byPerson = {}; live.forEach(p => { byPerson[p.person] = (byPerson[p.person] || 0) + (+p.amount || 0); });
  let h = '';
  const names = Object.keys(byPerson).sort((a,b) => byPerson[b] - byPerson[a]);
  if(names.length) h += panel("Paid through this page", '<div class="r4">' + names.slice(0,4).map(k => cell(title(k), money(byPerson[k]), {sub: live.filter(p => p.person === k).length + " payouts"})).join("") + '</div>');
  const rows = all.slice().sort((a,b) => String(a.loggedAt) < String(b.loggedAt) ? 1 : -1).map(p => {
    const ids = p.lines || [], v = !!p.voided, ns = ids.map(id => (S.lines.find(L => L.id === id) || {}).prospect).filter(Boolean);
    return [esc(fmtDY(p.datePaid)), esc(title(p.person)), esc(p.role || "") || null, (v ? '<s>' : '') + money(+p.amount) + (v ? '</s>' : ''), p.period ? esc(String(p.period).replace(/(\d{4}-\d\d-\d\d) to (\d{4}-\d\d-\d\d)/, (m,a,b) => fmtD(a) + " – " + fmtD(b))) : null,
      ids.length ? '<button class="name-btn lines-btn" data-id="' + esc(p.id) + '">' + ids.length + ' line' + (ids.length === 1 ? "" : "s") + '</button>' : '<span class="mute">oldest first</span>',
      ns.length ? esc(ns.slice(0,3).join(", ")) + (ns.length > 3 ? " +" + (ns.length - 3) : "") : null, esc(p.paidBy || "") || null, esc(p.notes || "") || null, '<span class="mute">' + esc(p.id) + '</span>',
      v ? '<span class="pill bad">voided</span>' : '<button class="btn sm danger void-btn" data-id="' + esc(p.id) + '">Void</button>']; });
  if(hist.length) h += panel("Paid before " + esc(fmtDY(S.paidThrough)) + " · already sent, not logged here", '<div class="tw">' + tableInner(["Rep","Lines","Commission"], Object.keys(histBy).sort((a,b) => histBy[b] - histBy[a]).map(k => [esc(title(k)), num(hist.filter(L => L.person === k).length), money(histBy[k])]), {left:[0]}) + '</div>', "hq-config.json → paidThrough");
  h += panel("Payouts", '<div class="tw">' + tableInner(["Paid","Rep","Role","Amount","Period","Lines","Deals","Paid by","Notes","ID",""], rows, {left:[1,2,6,7,8,9], empty:"No payouts logged yet. Tick Paid on the Pay Period page and the first one lands here."}) + '</div>', "newest first");
  h += '<div class="note"><p><strong>Ledger 2 is the record of money actually sent.</strong> Each row is written when someone ticks Paid, and lists the exact commission lines it covered. <strong>Void</strong> keeps the row but un-marks its lines, so the amount goes back to owed. Nothing here is ever deleted. Everything dated on or before ' + esc(fmtDY(S.paidThrough)) + ' was paid before this page existed and is summarised above.</p></div>';
  const pg = document.getElementById("page-l2"); pg.innerHTML = h;
  pg.querySelectorAll(".lines-btn").forEach(b => b.onclick = () => openPayout(b.dataset.id));
  pg.querySelectorAll(".void-btn").forEach(b => b.onclick = () => confirmVoid(b.dataset.id));
  document.getElementById("csv2").onclick = () => downloadCSV("sca-payouts-" + todayISO() + ".csv", [["Payout ID","Date Paid","Person","Role","Amount","Period","Lines","Paid By","Notes","Voided"]].concat(all.map(p => [p.id, p.datePaid, p.person, p.role, p.amount, p.period, (p.lines||[]).join(" "), p.paidBy, p.notes, p.voided ? "yes" : "no"])));
}
function openPayout(id){
  const p = (S.ST.payouts || []).find(x => x.id === id); if(!p) return;
  const ls = (p.lines || []).map(i => S.lines.find(L => L.id === i)).filter(Boolean);
  openDrawer(title(p.person) + " · " + money(+p.amount), "Paid " + esc(fmtDY(p.datePaid)) + (p.paidBy ? " by " + esc(p.paidBy) : "") + ' · <span class="mute">' + esc(id) + '</span>',
    '<div class="tw">' + tableInner(["Date","Customer","Collected","Role on deal","Payment","Commission"], ls.map(lineRow), {left:[1,3]}) + '</div>' + ((p.lines||[]).length !== ls.length ? '<div class="empty">' + ((p.lines||[]).length - ls.length) + ' line id(s) on this payout no longer match a deal.</div>' : ''));
}

/* ---------------- writes ---------------- */
function modal(ttl, body, okLabel, onOk){
  document.getElementById("md-title").textContent = ttl; document.getElementById("md-body").innerHTML = body;
  const ok = document.getElementById("md-ok"); ok.textContent = okLabel; ok.disabled = false;
  const m = document.getElementById("modal"); m.classList.add("on");
  const close = () => { m.classList.remove("on"); ok.onclick = null; };
  document.getElementById("md-cancel").onclick = () => { close(); if(onOk.cancel) onOk.cancel(); };
  ok.onclick = async () => { ok.disabled = true; try { await onOk(); close(); } catch(e){ ok.disabled = false; const er = document.getElementById("md-err"); if(er){ er.hidden = false; er.textContent = e.message; } } };
  const f = m.querySelector("input,textarea,select"); if(f) f.focus();
}
const byField = () => '<label>Your name<input type="text" id="md-by" value="' + esc(localStorage.getItem("hq.paidBy") || "") + '" placeholder="So the team knows who did this"></label>';
const takeBy = () => { const who = document.getElementById("md-by").value.trim(); if(!who) throw new Error("Put your name first."); localStorage.setItem("hq.paidBy", who); return who; };
function confirmPayout(k, onCancel){
  const p = S.people[k]; const s = personSummary(p);
  if(s.owedPeriod <= 0.004){ toast(title(k) + " has nothing owed in this period."); if(onCancel) onCancel(); return; }
  const fn = async () => { const paidBy = takeBy(), notes = document.getElementById("md-notes").value.trim(), date = document.getElementById("md-date").value;
    if(!/^\d{4}-\d\d-\d\d$/.test(date)) throw new Error("Date needs to be YYYY-MM-DD.");
    await writeAction({ action:"payout", person:k, role:Object.keys(p.roles).join(" + "), amount:r2(s.owedPeriod), period:S.fromD + " to " + S.toD, datePaid:date, lines:s.periodLines.map(L => L.id), by:paidBy, notes }, "Logged " + money(s.owedPeriod) + " to " + title(k));
    closeDrawer(); }; fn.cancel = onCancel;
  modal("Mark " + title(k) + " paid", '<div class="kv"><b>Amount</b><span style="font-family:var(--mono);font-weight:600">' + money(s.owedPeriod) + '</span><b>Period</b><span>' + esc(fmtD(S.fromD)) + ' – ' + esc(fmtD(S.toD)) + '</span><b>Covers</b><span>' + s.periodLines.length + ' line' + (s.periodLines.length === 1 ? "" : "s") + '</span></div>' +
    (s.owedOutside > 0.004 ? '<div class="note warn" style="padding:8px 12px"><span>' + money(s.owedOutside) + ' more is unpaid outside this period (' + s.outside.length + ' line' + (s.outside.length === 1 ? "" : "s") + '). Not included; widen the range to pay it.</span></div>' : '') +
    '<label>Date paid<input type="text" id="md-date" value="' + todayISO() + '"></label>' + byField() + '<label>Note (optional)<input type="text" id="md-notes" placeholder="Gusto, Zelle, partial, etc."></label><div class="err" id="md-err" hidden></div>' +
    '<div style="font-size:12px;color:var(--ink-3)">Writes one row to Ledger 2 and marks every line above as paid. Void it from Ledger 2 if it was a mistake.</div>', "Log payout", fn);
}
function dismissReview(id, onCancel){
  const r = S.reviews.find(x => x.id === id); if(!r) return;
  const fn = async () => { const who = takeBy(); await writeAction({ action:"dismiss", id, title:r.title, by:who, note:document.getElementById("md-notes").value.trim() }, "Dismissed"); }; fn.cancel = onCancel;
  modal("Dismiss this item", '<div style="font-weight:600;color:var(--ink)">' + esc(r.title) + '</div>' + byField() + '<label>What was done (optional)<input type="text" id="md-notes"></label><div class="err" id="md-err" hidden></div><div style="font-size:12px;color:var(--ink-3)">Hides it for everyone. Restore from the “dismissed” button on the review panel.</div>', "Dismiss", fn);
}
function confirmVoid(id){
  const p = (S.ST.payouts || []).find(x => x.id === id); if(!p) return;
  const fn = async () => { const who = takeBy(); await writeAction({ action:"void", id, by:who, note:document.getElementById("md-notes").value.trim() }, "Voided " + id); };
  modal("Void payout " + id, '<div class="kv"><b>Rep</b><span>' + esc(title(p.person)) + '</span><b>Amount</b><span style="font-family:var(--mono)">' + money(+p.amount) + '</span></div>' + byField() + '<label>Why<input type="text" id="md-notes"></label><div class="err" id="md-err" hidden></div><div style="font-size:12px;color:var(--ink-3)">The row stays in Ledger 2 marked voided; its lines go back to owed.</div>', "Void", fn);
}
/* A Whop payment nobody could match: a human picks the closer/setter; saved on the API as a manual match. */
function assignMatch(item){
  const names = (S.C.roster || []).map(r => normName(r.name)).filter(isPerson);
  Object.keys(S.people).forEach(k => { if(!names.includes(k)) names.push(k); });
  const opts = sel => '<option value="">—</option>' + names.map(n => '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' + esc(title(n)) + '</option>').join("");
  const sug = item.suggestion || null, d = S.dealRows.find(x => x.key === item.dealKey);
  const fn = async () => {
    const closer = document.getElementById("md-closer").value, setter = document.getElementById("md-setter").value, who = takeBy();
    if(!closer && !setter) throw new Error("Pick a closer (or a setter).");
    await writeAction({ action:"match", paymentId:item.pid, contactId: d ? d.contactId : "", closer: closer || (d ? d.closer : ""), setter, by:who, note: document.getElementById("md-notes").value.trim() || (sug ? "confirmed form suggestion: " + sug.prospect : "") }, "Saved"); };
  modal("Who earns this?", '<div style="font-weight:600;color:var(--ink)">' + esc(item.title) + '</div>' +
    (sug ? '<div class="note" style="padding:8px 12px"><span>Most likely: <b>' + esc(title(sug.closer)) + '</b> closed <b>' + esc(sug.prospect) + '</b> on ' + esc(fmtD(sug.date)) + ' for ' + money(sug.cash) + (sug.setter ? ', set by ' + esc(title(sug.setter)) : '') + '. Same person? Keep the names below and save.</span></div>' : '') +
    '<label>Closer<select id="md-closer">' + opts(sug ? sug.closer : (item.closer || "")) + '</select></label><label>Setter<select id="md-setter">' + opts(sug ? sug.setter : (item.setter || "")) + '</select></label>' + byField() + '<label>Note (optional)<input type="text" id="md-notes"></label><div class="err" id="md-err" hidden></div>' +
    '<div style="font-size:12px;color:var(--ink-3)">From then on this Whop payment (and its installments) pays that closer and setter. Saved on the API with your name and the time.</div>', "Save", fn);
}
async function writeAction(payload, okMsg){
  if(!S.token) throw new Error("Not signed in.");
  const j = await api(null, payload);
  S.ST = j.state || S.ST; compute(); renderAll();
  toast(okMsg); return j;
}

/* ---------------- utils ---------------- */
let toastT; function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
window.__HQ = S;   /* read-only hook for the headless render check */
/* ---------------- boot: the whole page is behind the admin password ---------------- */
function gate(msg){
  return new Promise(resolve => {
    document.getElementById("page-pay").innerHTML = '<div class="panel"><div class="panel-head">Admin only</div><div style="padding:18px 16px;max-width:460px">' + (msg ? '<div class="note crit" style="margin-bottom:12px"><p>' + esc(msg) + '</p></div>' : '') +
      '<p style="margin-bottom:10px">This page shows commissions for the whole sales team. Enter the admin password to continue.</p><label>Password<input type="password" id="gate-pw" autocomplete="current-password"></label><div style="margin-top:12px"><button class="btn primary" id="gate-go">Enter</button></div></div></div>';
    const go = () => { const t = document.getElementById("gate-pw").value.trim(); if(!t) return;   /* the API is the judge, not this page */
      S.token = t; try { localStorage.setItem("hq.tok", t); } catch(_){} resolve(true); };
    document.getElementById("gate-go").onclick = go; document.getElementById("gate-pw").onkeydown = e => { if(e.key === "Enter") go(); }; document.getElementById("gate-pw").focus();
  });
}
async function enter(){
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => showPage(b.dataset.page));
  document.getElementById("dr-close").onclick = closeDrawer; document.getElementById("scrim").onclick = closeDrawer;
  document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeDrawer(); document.getElementById("modal").classList.remove("on"); } });
  S.page = ({ "#l1":"l1", "#l2":"l2" })[location.hash] || "pay";
  let t = ""; try { t = localStorage.getItem("hq.tok") || ""; } catch(_){}
  if(t) S.token = t; else await gate();
  for(;;){
    document.getElementById("page-pay").innerHTML = '<div class="panel"><div class="panel-head">Loading Whop, GHL and the End of Call form</div><div style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="skel" style="width:60%"></div><div class="skel" style="width:40%"></div><div class="skel" style="width:75%"></div></div></div>';
    try { await load(); break; }
    catch(e){ if(/bad token/i.test(e.message)) await gate("That password was rejected. It must match HQ_TOKEN in the Apps Script exactly."); else { document.getElementById("page-pay").innerHTML = '<div class="note crit"><p><strong>Could not load.</strong> ' + esc(e.message) + '</p></div>'; return; } }
  }
  setInterval(() => { if(document.visibilityState === "visible") load().catch(() => {}); }, 10 * 60 * 1000);
}
enter();
</script>
