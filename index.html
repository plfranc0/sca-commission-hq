<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SCA Commission HQ</title>
<style>
:root{
  --ground:#FDF9F4; --surface:#FFFFFF; --surface-2:#F7EFEA; --surface-3:#F1E4DD;
  --ink:#221418; --ink-2:#4C3A3D; --ink-3:#8A7477;
  --accent:#7A1420; --head-bg:#7A1420; --head-ink:#FFFFFF;
  --hair:#E4D6CF; --hair-2:#F0E4DE;
  --good:#2F6B4F; --warn:#9A6B12; --crit:#B3261E;
  --good-bg:#E6F0EA; --warn-bg:#F6EEDD; --crit-bg:#F8E6E4;
  --side-bg:#221418; --side-ink:#F4EBE6; --side-ink-2:#B9A3A0; --side-hair:#3A2628; --side-active:#7A1420;
  --shadow:0 1px 2px rgba(34,20,24,.05), 0 8px 24px -14px rgba(34,20,24,.16);
  --display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17110F; --surface:#221A19; --surface-2:#2C2221; --surface-3:#352827;
    --ink:#F4EBE6; --ink-2:#C4B0AC; --ink-3:#8E7B78;
    --accent:#DC6076; --head-bg:#4A1F27; --head-ink:#F7E4E6;
    --hair:#3A2B2B; --hair-2:#2E2323;
    --good:#5FAF87; --warn:#D2A03F; --crit:#E0706A;
    --good-bg:#1D2A24; --warn-bg:#2C2418; --crit-bg:#2E1E1D;
    --side-bg:#110C0B; --side-ink:#F4EBE6; --side-ink-2:#8E7B78; --side-hair:#2A1F1F; --side-active:#4A1F27;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#17110F; --surface:#221A19; --surface-2:#2C2221; --surface-3:#352827;
  --ink:#F4EBE6; --ink-2:#C4B0AC; --ink-3:#8E7B78;
  --accent:#DC6076; --head-bg:#4A1F27; --head-ink:#F7E4E6;
  --hair:#3A2B2B; --hair-2:#2E2323;
  --good:#5FAF87; --warn:#D2A03F; --crit:#E0706A;
  --good-bg:#1D2A24; --warn-bg:#2C2418; --crit-bg:#2E1E1D;
  --side-bg:#110C0B; --side-ink:#F4EBE6; --side-ink-2:#8E7B78; --side-hair:#2A1F1F; --side-active:#4A1F27;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground); color:var(--ink-2); font-family:var(--ui); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:var(--ui)}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh}
.side{width:236px; flex:0 0 236px; background:var(--side-bg); color:var(--side-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{padding:22px 20px 18px; border-bottom:1px solid var(--side-hair)}
.brand .k{font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--side-ink-2)}
.brand .t{font-family:var(--display); font-size:21px; font-weight:600; line-height:1.15; margin-top:4px}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px}
.nav button{appearance:none; background:none; border:none; color:var(--side-ink-2); text-align:left; padding:10px 12px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; width:100%}
.nav button .ic{width:18px; text-align:center; font-family:var(--mono); font-size:12px; opacity:.8}
.nav button:hover{color:var(--side-ink); background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{background:var(--side-active); color:#fff}
.nav button .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; background:rgba(255,255,255,.12); padding:1px 7px; border-radius:10px}
.nav button .cnt.hot{background:#E0706A; color:#1a0c0c}
.side-foot{margin-top:auto; padding:16px 20px 20px; border-top:1px solid var(--side-hair); font-size:11.5px; color:var(--side-ink-2); display:flex; flex-direction:column; gap:6px}
.side-foot a{color:var(--side-ink)}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#5FAF87; margin-right:6px; vertical-align:middle}
.dot.bad{background:#E0706A}
.dot.warn{background:#D2A03F}
.main{flex:1; min-width:0; padding:28px 32px 60px}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.topbar h1{font-family:var(--display); font-size:30px; font-weight:600; color:var(--ink); line-height:1.1; letter-spacing:-.01em}
.topbar .sub{font-size:13px; color:var(--ink-3); margin-top:4px}
.ctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
select,input[type="text"],input[type="password"],input[type="search"],textarea{font-family:var(--ui); font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--hair); border-radius:6px; padding:7px 10px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{appearance:none; border:1px solid var(--hair); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:6px; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit); border-color:var(--crit)}
.btn:disabled{opacity:.5; cursor:default}
.btn.sm{padding:4px 9px; font-size:11.5px}

/* ---------- panels ---------- */
.stack{display:flex; flex-direction:column; gap:18px}
.r3{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair)}
.r4{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--hair)}
@media(max-width:1000px){.r4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.r3,.r4{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--hair); border-radius:8px; overflow:hidden; box-shadow:var(--shadow)}
.panel-head{background:var(--head-bg); color:var(--head-ink); font-family:var(--display); font-size:15.5px; font-weight:600; padding:11px 16px; letter-spacing:.01em; display:flex; align-items:center; justify-content:space-between; gap:12px}
.panel-head .r{font-family:var(--ui); font-size:11.5px; font-weight:600; opacity:.85}
.cell{background:var(--surface); display:flex; flex-direction:column; min-width:0}
.cell-label{background:var(--surface-2); padding:7px 12px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cell-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:2px}
.cell-val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:23px; font-weight:600; color:var(--ink); line-height:1.1; letter-spacing:-.02em}
.cell-sub{font-size:11px; color:var(--ink-3); line-height:1.35}
.cell.good .cell-val{color:var(--good)}
.cell.bad .cell-val{color:var(--crit)}
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:640px}
th{background:var(--surface-2); color:var(--ink-3); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:right; padding:8px 12px; white-space:nowrap; border-bottom:1px solid var(--hair)}
td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--hair-2); font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap}
th.l,td.l{text-align:left; font-family:var(--ui)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.mute{color:var(--ink-3)}
th.sort{cursor:pointer; user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[data-dir="asc"]::after{content:" ↑"} th.sort[data-dir="desc"]::after{content:" ↓"}
.pill{display:inline-block; font-family:var(--ui); font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:20px; background:var(--surface-3); color:var(--ink-2)}
.pill.ok{background:var(--good-bg); color:var(--good)}
.pill.chk{background:var(--warn-bg); color:var(--warn)}
.pill.bad{background:var(--crit-bg); color:var(--crit)}
.note{border:1px solid var(--hair); border-left:3px solid var(--accent); background:var(--surface); border-radius:6px; padding:12px 16px; font-size:13px; display:flex; flex-direction:column; gap:5px}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--warn)}
.note.crit{border-left-color:var(--crit)}
.empty{padding:22px 16px; color:var(--ink-3); font-size:13px; text-align:center}
.name-btn{appearance:none; background:none; border:none; padding:0; color:var(--ink); font-family:var(--ui); font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--accent); color:var(--accent)}
.role{font-size:11px; color:var(--ink-3); font-family:var(--ui)}

/* ---------- review queue ---------- */
.q{display:flex; flex-direction:column}
.qi{display:flex; gap:12px; align-items:flex-start; padding:11px 16px; border-bottom:1px solid var(--hair-2)}
.qi:last-child{border-bottom:none}
.qi input[type="checkbox"]{margin-top:4px; width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:0 0 16px}
.qi .b{flex:1; min-width:0}
.qi .t{font-weight:600; color:var(--ink); font-size:13.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.qi .d{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.qi .d .mono{font-family:var(--mono); font-size:12px}
.lv{font-size:9.5px; font-weight:800; letter-spacing:.08em; padding:2px 7px; border-radius:4px; text-transform:uppercase}
.lv.u{background:var(--crit); color:#fff}
.lv.i{background:var(--surface-3); color:var(--ink-2)}
.qi.locked input{visibility:hidden}

/* ---------- pay table ---------- */
.pay td{padding:10px 12px}
.pay input[type="checkbox"]{width:18px; height:18px; accent-color:var(--good); cursor:pointer; vertical-align:middle}
.pay .owed{font-size:16px; font-weight:600}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(20,10,12,.45); display:none; z-index:40}
.scrim.on{display:block}
.drawer{position:fixed; top:0; right:0; height:100vh; width:min(720px,100vw); background:var(--surface); border-left:1px solid var(--hair); box-shadow:-12px 0 40px -20px rgba(0,0,0,.5); z-index:50; transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column}
.drawer.on{transform:none}
.drawer-head{padding:18px 20px 14px; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.drawer-head h2{font-family:var(--display); font-size:22px; color:var(--ink); font-weight:600; line-height:1.1}
.drawer-head .sub{font-size:12.5px; color:var(--ink-3); margin-top:3px}
.drawer-body{overflow:auto; flex:1}
.drawer-body table{min-width:0; font-size:12px}
.drawer-body td,.drawer-body th{padding:7px 9px}
.drawer-foot{padding:14px 20px; border-top:1px solid var(--hair); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.x{appearance:none; border:none; background:var(--surface-2); color:var(--ink-2); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px}
.sec{padding:10px 20px 4px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--surface); border:1px solid var(--hair); border-radius:10px; width:min(480px,100%); box-shadow:var(--shadow); overflow:hidden}
.modal .bh{padding:16px 20px 10px}
.modal h3{font-family:var(--display); font-size:20px; color:var(--ink); font-weight:600}
.modal .bb{padding:0 20px 16px; font-size:13.5px; display:flex; flex-direction:column; gap:10px}
.modal label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; flex-direction:column; gap:4px}
.modal .bf{padding:12px 20px; border-top:1px solid var(--hair); display:flex; justify-content:flex-end; gap:8px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.kv b{color:var(--ink-3); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em}
.err{color:var(--crit); font-size:12.5px}

/* ---------- gate ---------- */
.gate{position:fixed; inset:0; background:var(--ground); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px}
.gate .box{width:min(380px,100%); background:var(--surface); border:1px solid var(--hair); border-radius:10px; padding:26px 26px 22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px}
.gate h1{font-family:var(--display); font-size:24px; color:var(--ink); font-weight:600}
.gate p{font-size:13px; color:var(--ink-3)}
.gate input{font-size:15px; padding:10px 12px}

/* ---------- misc ---------- */
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:8px; font-size:13px; z-index:70; display:none; max-width:90vw}
.toast.on{display:block}
.filters{display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--hair); background:var(--surface-2)}
.filters select,.filters input{font-size:12.5px; padding:6px 9px}
.skel{height:14px; background:var(--surface-3); border-radius:4px; animation:sk 1.2s infinite}
@keyframes sk{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel{animation:none} .drawer{transition:none}}
.menu-btn{display:none}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%; flex:none; height:auto; position:static}
  .nav{flex-direction:row; overflow-x:auto; padding:8px 10px}
  .nav button{white-space:nowrap; width:auto}
  .side-foot{display:none}
  .main{padding:18px 14px 50px}
  .topbar h1{font-size:24px}
}
@media print{.side,.ctl,.scrim,.drawer,.toast{display:none!important} .main{padding:0}}
</style>
</head>
<body>

<div class="shell" id="shell">
  <aside class="side">
    <div class="brand">
      <div class="k">She Creates Academy</div>
      <div class="t">Commission HQ</div>
    </div>
    <nav class="nav" aria-label="Sections">
      <button id="nav-pay" data-page="pay" aria-current="page"><span class="ic">01</span>Pay Period<span class="cnt" id="cnt-pay" hidden></span></button>
      <button id="nav-l1" data-page="l1"><span class="ic">02</span>Ledger 1 · Deals<span class="cnt" id="cnt-l1" hidden></span></button>
      <button id="nav-l2" data-page="l2"><span class="ic">03</span>Ledger 2 · Payouts<span class="cnt" id="cnt-l2" hidden></span></button>
    </nav>
    <div class="side-foot">
      <div id="sf-status"><span class="dot"></span>Loading</div>
      <div id="sf-fetched"></div>
      <div id="sf-write"></div>
      <a id="sf-sheet" href="#" target="_blank" rel="noopener">Open the Sales Team HQ sheet</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pg-title">Pay Period</h1>
        <div class="sub" id="pg-sub"></div>
      </div>
      <div class="ctl" id="pg-ctl"></div>
    </div>
    <section class="stack" id="page-pay"></section>
    <section class="stack" id="page-l1" hidden></section>
    <section class="stack" id="page-l2" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><h2 id="dr-title"></h2><div class="sub" id="dr-sub"></div></div>
    <button class="x" id="dr-close" aria-label="Close">×</button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
  <div class="drawer-foot" id="dr-foot"></div>
</aside>

<div class="modal" id="modal"><div class="box">
  <div class="bh"><h3 id="md-title"></h3></div>
  <div class="bb" id="md-body"></div>
  <div class="bf"><button class="btn" id="md-cancel">Cancel</button><button class="btn primary" id="md-ok">Confirm</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   SCA Commission HQ
   Reads the "SCA Commission HQ" Google Sheet live (gviz, anyone-with-link
   viewer). Writes (payouts, dismissals, voids) go through a tiny Apps Script
   web app bound to that sheet; the passphrase entered at the gate is the
   write token, checked server-side against Script Property HQ_TOKEN.
   ===================================================================== */

const CFG = {
  SID: "1penRbU53iKOGeYFJKSouE7d-YCq_lgyHrH29tUQPtK4",   /* SCA Sales Team HQ — Single Source of Truth (Maya's Commissions Tracker lives here) */
  TABS: { roster:"HQ Roster", config:"HQ Config", payouts:"HQ Payouts", dismissed:"HQ Dismissed", maya:"Commissions Tracker" },
  /* The four feed tabs are read straight from the Master Tracker (already link-shared),
     so the page has data even before the HQ sheet's IMPORTRANGE mirrors are authorised. */
  FEEDS: { "Deals":{sid:"1AaqCLsqpdhzktzE002UvN1aBGsMXajksak_w8qL_tos",tab:"Cash Log"},
           "Calls":{sid:"1AaqCLsqpdhzktzE002UvN1aBGsMXajksak_w8qL_tos",tab:"_calls"},
           "Whop":{sid:"1AaqCLsqpdhzktzE002UvN1aBGsMXajksak_w8qL_tos",tab:"Whop Recon",range:"A10:Q1000"},
           "Whop Payments":{sid:"1AaqCLsqpdhzktzE002UvN1aBGsMXajksak_w8qL_tos",tab:"Whop Payments"} },
  /* Apps Script web app URL (…/exec). Empty = read-only mode with a banner. */
  WEBAPP: "",
  /* SHA-256 of the team passphrase. Change with:
     python3 -c "import hashlib;print(hashlib.sha256(b'NEW').hexdigest())" */
  PASS_HASH: "8bbd6399df87ce04dc3b01c112b6f4c49d61890d4e796488a518b684855bfeb6",
  DEFAULTS: { closerRate:0.10, setterRateBefore:0.05, show:30, close:50, kaiaWeekly:150, flatFrom:"2026-08-27", staleHours:36, teamRate:0.035, lateDays:35 },
  REVIEW_WINDOW_DAYS: 60
};
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + CFG.SID + "/edit";

/* ---------------- state ---------------- */
const S = { deals:[], calls:[], whop:[], whopPay:[], roster:[], payouts:[], dismissed:[], maya:{blocks:[], rows:[]}, config:{}, errors:{},
            lines:[], people:{}, weeks:[], fromD:null, toD:null, fetched:null, page:"pay", token:"" };

/* ---------------- data ---------------- */
async function gviz(tab, range){
  const map = (window.HQ_TEST_MAP || CFG.FEEDS || {})[tab];
  const sid = map ? map.sid : CFG.SID, sheet = map ? map.tab : tab, rg = map ? map.range : range;
  const url = "https://docs.google.com/spreadsheets/d/" + sid + "/gviz/tq?tqx=out:json&headers=1&sheet=" +
              encodeURIComponent(sheet) + (rg ? "&range=" + encodeURIComponent(rg) : "") + "&t=" + Date.now();
  const res = await fetch(url);
  if(!res.ok) throw new Error("Tab “" + tab + "”: HTTP " + res.status + ". Is the sheet shared with anyone-with-the-link (viewer)?");
  const text = await res.text();
  const open = text.indexOf("setResponse("), close = text.lastIndexOf(")");
  if(open === -1 || close === -1) throw new Error("Tab “" + tab + "” returned an unexpected response.");
  const d = JSON.parse(text.slice(open + 12, close));
  if(d.status !== "ok") throw new Error("Tab “" + tab + "”: " + JSON.stringify(d.errors || d.status));
  const cols = d.table.cols.map(c => (c.label || c.id || "").trim());
  return d.table.rows.map(r => { const o = {}; cols.forEach((name, i) => { const c = r.c[i]; o[name] = c ? c.v : null; }); return o; })
    .filter(o => Object.values(o).some(v => v !== null && v !== ""));
}
const DATE_COLS = ["Week (Thu)","Call Date","Whop Paid Date","Date Paid","Paid Date","Period","Dismissed At","Logged At"];
const gvDate = v => { const m = /^Date\((\d+),(\d+),(\d+)/.exec(String(v));
  return m ? m[1]+"-"+String(+m[2]+1).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0") : String(v); };
function isoRows(rows){ rows.forEach(r => DATE_COLS.forEach(k => { if(k in r && r[k] !== null && r[k] !== "") r[k] = gvDate(r[k]); })); return rows; }
/* Cash Log money can arrive as a number or as text like "$3,000" / "3k". */
const amt = v => { if(typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v||"").trim().toLowerCase().replace(/[$,\s]/g,""); if(!s) return 0;
  const k = /k$/.test(s); s = s.replace(/k$/,""); const x = parseFloat(s); return isFinite(x) ? (k ? x*1000 : x) : 0; };
const has = v => v !== null && v !== undefined && v !== "";
const normName = s => String(s||"").trim().toUpperCase();
const ARTIFACT = /^\(UNASSIGNED\)$|^NONE$|^N\/A$|^-+$/i;
const isPerson = s => has(s) && !ARTIFACT.test(normName(s));
const truthy = v => v === true || /^true$|^yes$|^1$/i.test(String(v||"").trim());

/* ---------------- format ---------------- */
const money = v => (v === null || v === undefined || !isFinite(v)) ? "—" : (v < 0 ? "-" : "") + "$" + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: (Math.round(Math.abs(v)*100)%100) ? 2 : 0, maximumFractionDigits:2});
const num = v => (v === null || v === undefined || !isFinite(v)) ? "—" : Math.round(v).toLocaleString("en-US");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = iso => { const p = String(iso||"").split("-"); return p.length === 3 ? MON[+p[1]-1] + " " + (+p[2]) : String(iso||"—"); };
const fmtDY = iso => { const p = String(iso||"").split("-"); return p.length === 3 ? MON[+p[1]-1] + " " + (+p[2]) + ", " + p[0] : String(iso||"—"); };
const title = s => String(s||"").toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayShift = (iso, d) => { const p = String(iso).split("-"); if(p.length !== 3) return iso;
  const t = new Date(Date.UTC(+p[0], +p[1]-1, +p[2] + d)); return t.toISOString().slice(0,10); };
const todayISO = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0"); };
/* Thursday-anchored week containing an ISO date */
const thuWeek = iso => { const p = String(iso).split("-"); if(p.length !== 3) return iso;
  const t = new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); const back = (t.getUTCDay() - 4 + 7) % 7; t.setUTCDate(t.getUTCDate() - back); return t.toISOString().slice(0,10); };
const wkLabel = w => "Thu " + fmtD(w) + " – Wed " + fmtD(dayShift(w, 6));
const inRange = d => { const x = String(d||""); return x >= S.fromD && x <= S.toD; };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

/* ---------------- load ---------------- */
async function load(){
  const T = CFG.TABS;
  const tabs = ["Deals","Calls","Whop","Whop Payments",T.roster,T.payouts,T.dismissed,T.config,T.maya];
  const out = await Promise.all(tabs.map(t => gviz(t).catch(e => e)));
  const pick = (i, key) => { if(out[i] instanceof Error){ S.errors[key] = out[i].message; return []; } delete S.errors[key]; return isoRows(out[i]); };
  S.deals = pick(0,"Deals"); S.calls = pick(1,"Calls"); S.whop = pick(2,"Whop"); S.whopPay = pick(3,"Whop Payments");
  S.roster = pick(4,"Roster"); S.payouts = pick(5,"Payouts").filter(r => has(r["Payout ID"])); S.dismissed = pick(6,"Dismissed");
  S.maya = parseMaya(pick(8,"Maya"));
  S.config = {}; pick(7,"Config").forEach(r => { if(has(r["Setting"])) S.config[String(r["Setting"]).trim()] = r["Value"]; });
  S.fetched = new Date();
  compute();
  renderAll();
}

/* ---------------- Maya's Commissions Tracker ----------------
   Human-shaped: blocks per pay period ("Week Of" filled only on the first row), deal rows,
   then a footer of label rows in the Date column (Total Cash Collected:, Closer Comms…,
   Approved by Maya, Wire Transfer Sent, Wire Send Date / Time) with the value in Customer Name. */
const LABELS = /^(total cash|commissions$|closer comms|setter comms|team comms|total commissions|approved by maya|wire transfer sent|wire send date)/i;
function mdy(v){ /* "7/20/2026", "7/21/2026 12:24:49", "8/14", or a gviz Date(...) */
  if(/^Date\(/.test(String(v))) return gvDate(v);
  const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/.exec(String(v||"").trim()); if(!m) return "";
  const y = m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : "2026";
  return y + "-" + m[1].padStart(2,"0") + "-" + m[2].padStart(2,"0"); }
function parseMaya(rows){
  const blocks = [], all = []; let b = null;
  rows.forEach(r => {
    const wk = String(r["Week Of"]||"").trim(), dt = String(r["Date"]||"").trim(), name = String(r["Customer Name"]||"").trim();
    if(wk){ const m = /^(\d{1,2}\/\d{1,2})\s*-\s*(\d{1,2}\/\d{1,2})/.exec(wk);
      b = { label: wk, from: m ? mdy(m[1]) : "", to: m ? mdy(m[2]) : "", approved:null, wireSent:null, wireDate:"", rows:[] }; blocks.push(b); }
    if(!b) return;
    if(LABELS.test(dt)){
      if(/^approved by maya/i.test(dt)) b.approved = truthy(name);
      if(/^wire transfer sent/i.test(dt)) b.wireSent = truthy(name);
      if(/^wire send date/i.test(dt)) b.wireDate = name;
      return; }
    if(!name || LABELS.test(name)) return;
    const row = { block:b, period:b.label, date: mdy(r["Date"]) || b.from, name, email:String(r["Email"]||"").trim().toLowerCase(), cash: amt(r["Gross Cash Collected"]),
      plan:String(r["Installment Payment"]||"").trim(), isInstallment: truthy(r["Installment Payment"]), offer:String(r["Offer"]||"").trim(), method:String(r["Payment Method"]||"").trim(),
      closer: normName(r["Closer"]), setter: normName(r["Setter"]), triage: String(r["Triage Completed?"]||"").trim(), approved: truthy(r["Approved By Maya"]), notes:String(r["Notes"]||""), matched:null };
    b.rows.push(row); all.push(row); });
  return { blocks, rows: all };
}
/* name similarity for matching Maya's hand-typed names ("Pav", "Teena", card-holder names) to deals */
const squash = s => String(s||"").toLowerCase().replace(/[^a-z]/g,"");
function nameLike(a, b){ const A = squash(a), B = squash(b); if(!A || !B) return false; if(A === B) return true;
  const fa = squash(String(a).trim().split(/\s+/)[0]), fb = squash(String(b).trim().split(/\s+/)[0]);
  return (A.length >= 3 && (B.startsWith(A) || A.startsWith(B))) || (fa.length >= 3 && fa === fb); }

/* ---------------- model ---------------- */
function cfgNum(key, dflt){ const v = S.config[key]; const x = typeof v === "number" ? v : parseFloat(String(v||"")); return isFinite(x) ? x : dflt; }
function cfgDate(key, dflt){ const v = S.config[key]; return has(v) ? gvDate(v) : dflt; }

function rosterFor(name){
  const r = S.roster.find(x => normName(x["Name"]) === name);
  if(!r) return null;
  return { name, role: String(r["Role"]||""), closerRate: amt(r["Closer Rate"]) || 0, show: amt(r["Show $"]), close: amt(r["Close $"]),
           weekly: amt(r["Weekly $"]), active: r["Active"] === null ? true : truthy(r["Active"]), notes: String(r["Notes"]||""), onRoster:true };
}

function compute(){
  const D = CFG.DEFAULTS;
  const FLAT_FROM = cfgDate("Setter flat model from", D.flatFrom);
  const KAIA_FROM = cfgDate("Kaia weekly from", FLAT_FROM);
  const SETTER_BEFORE = cfgNum("Setter rate (before)", D.setterRateBefore);
  const TEAM_RATE = cfgNum("Team commission rate", D.teamRate), TEAM_TO = normName(S.config["Team commission to"] || "");
  const INSTALLMENTS_ON = !/^(no|false|0)$/i.test(String(S.config["Installments commissionable"] ?? "yes").trim());
  S.teamUnassigned = [];

  /* Whop status per deal: prospect + call date, ±1 day tolerance */
  const wmap = {};
  S.whop.forEach(r => { const nm = normName(r["Prospect"]), cd = String(r["Call Date"]||""); if(!nm || !cd) return;
    [0,-1,1].forEach((d,i) => { const k = nm + "|" + dayShift(cd, d); if(i === 0 || !wmap[k]) wmap[k] = r; }); });

  /* Installments from Whop Payments, keyed by email: a plan's later payments (subscription_cycle) */
  const cycles = {};
  S.whopPay.forEach(r => { const em = String(r["Email"]||"").trim().toLowerCase(); if(!em || !/subscription_cycle/.test(String(r["Billing Reason"]||""))) return;
    (cycles[em] = cycles[em] || []).push({ date: gvDate(r["Paid Date"]), amount: amt(r["Amount"]) - amt(r["Refunded"]), name: String(r["Billing Name"]||r["Enrollment Name"]||""), email: em, used:false }); });

  const people = {};
  const P = name => { if(!people[name]){ const ro = rosterFor(name); people[name] = { name, roster: ro, roles:{}, lines:[] }; } return people[name]; };
  const lines = [];   /* every commission line: {id, person, role, amount, dealKey, date, week, prospect, offer, cash, kind} */

  /* Deals from the Cash Log */
  S.dealRows = S.deals.map((r, i) => {
    const date = String(r["Call Date"]||""), week = has(r["Week (Thu)"]) ? String(r["Week (Thu)"]) : thuWeek(date);
    const prospect = String(r["Prospect"]||"").trim(), closer = normName(r["Closer"]), setter = normName(r["Setter"]);
    const cash = amt(r["Cash Collected"]), revenue = amt(r["Revenue Contracted"]);
    const flat = week >= FLAT_FROM;
    const key = "D|" + date + "|" + normName(prospect) + "|" + closer;
    const w = wmap[normName(prospect) + "|" + date] || null;
    /* the recon job runs once a day at 6 AM PT, so a deal filed today has no row yet: that is pending, not missing */
    const whopStatus = w ? String(w["Recon Status"]||"") : (S.whop.length ? (daysBetween(date, todayISO()) <= 2 ? "PENDING RECON" : "NOT ON WHOP") : "");
    const refunded = w ? amt(w["Whop Refunded"]) : 0;
    const email = w ? String(w["Whop Email"]||"").trim().toLowerCase() : "";
    const firstPaid = w && has(w["Whop Paid Date"]) ? String(w["Whop Paid Date"]) : date;
    const later = (email && cycles[email] ? cycles[email] : []).filter(c => c.date > firstPaid);
    const collected = cash + later.reduce((s,c) => s + c.amount, 0);
    const lastPayment = later.length ? later.map(c => c.date).sort().pop() : (w && has(w["Whop Paid Date"]) ? String(w["Whop Paid Date"]) : "");
    const remaining = Math.max(revenue - collected, 0);
    const d = { i, key, date, week, prospect, closer, setter, offer:String(r["Offer"]||""), payType:String(r["Pay Type"]||""), cash, revenue,
                collected, remaining, lastPayment, installments: later.length, email,
                flat, whop:w, whopStatus, refunded, closerComm:0, setterComm:0, dmSetter: closer === "KAIA" ? "KAIA" : "", lines:[] };
    /* closer line */
    if(isPerson(closer)){
      const ro = rosterFor(closer); const rate = ro && ro.closerRate ? ro.closerRate : D.closerRate;
      const logged = amt(r["Closer Commission"]);
      d.closerComm = logged > 0 ? logged : Math.round(cash * rate * 100) / 100;
      const L = { id:key+"|C", person:closer, role:"Closer", amount:d.closerComm, dealKey:key, date, week, prospect, offer:d.offer, cash, kind:"close" };
      lines.push(L); d.lines.push(L); P(closer).roles.Closer = 1;
    }
    /* setter line: flat model = $50 on a close (replaces the $30 show); before = % of cash */
    if(isPerson(setter)){
      const ro = rosterFor(setter);
      d.setterComm = flat ? (ro && ro.close ? ro.close : D.close) : (amt(r["Setter Commission"]) || Math.round(cash * SETTER_BEFORE * 100) / 100);
      const L = { id:key+"|S", person:setter, role:"Setter", amount:d.setterComm, dealKey:key, date, week, prospect, offer:d.offer, cash, kind: flat ? "set-close" : "set-pct" };
      lines.push(L); d.lines.push(L); P(setter).roles.Setter = 1;
    }
    /* team line (3.5% on the Commissions Tracker) */
    if(TEAM_RATE > 0 && cash > 0){ const a = Math.round(cash * TEAM_RATE * 100) / 100;
      if(TEAM_TO){ const L = { id:key+"|T", person:TEAM_TO, role:"Team", amount:a, dealKey:key, date, week, prospect, offer:d.offer, cash, kind:"team" }; lines.push(L); d.lines.push(L); P(TEAM_TO).roles.Team = 1; }
      else S.teamUnassigned.push({ date, amount:a, prospect }); }
    /* installments: the closer earns her rate on each later payment as it lands (Maya's practice) */
    if(INSTALLMENTS_ON && isPerson(closer)) later.forEach(c => { c.used = true;
      const ro = rosterFor(closer); const rate = ro && ro.closerRate ? ro.closerRate : D.closerRate; const a = Math.round(c.amount * rate * 100) / 100;
      const L = { id:"I|" + c.date + "|" + normName(prospect) + "|" + closer + "|C", person:closer, role:"Closer", amount:a, dealKey:key, date:c.date, week:thuWeek(c.date), prospect, offer:"Installment · " + d.offer, cash:c.amount, kind:"installment" };
      lines.push(L); d.lines.push(L);
      if(TEAM_RATE > 0){ const t = Math.round(c.amount * TEAM_RATE * 100) / 100;
        if(TEAM_TO){ const TL = { id:"I|" + c.date + "|" + normName(prospect) + "|" + closer + "|T", person:TEAM_TO, role:"Team", amount:t, dealKey:key, date:c.date, week:thuWeek(c.date), prospect, offer:"Installment · " + d.offer, cash:c.amount, kind:"team" }; lines.push(TL); d.lines.push(TL); }
        else S.teamUnassigned.push({ date:c.date, amount:t, prospect }); } });
    return d;
  });

  S.orphanCycles = Object.values(cycles).flat().filter(c => !c.used && c.amount > 0);

  /* Setter shows without a close: held calls on _calls, flat model only */
  const closedKeys = new Set(S.dealRows.map(d => normName(d.prospect) + "|" + d.date));
  S.showRows = [];
  S.calls.forEach(r => {
    const week = String(r["Week (Thu)"]||""), date = String(r["Call Date"]||""), setter = normName(r["Setter"]), prospect = String(r["Prospect"]||"").trim();
    if(week < FLAT_FROM || amt(r["Held"]) !== 1 || amt(r["Closed"]) === 1 || !isPerson(setter)) return;
    if(closedKeys.has(normName(prospect) + "|" + date)) return;
    const ro = rosterFor(setter); const a = ro && ro.show ? ro.show : D.show;
    const key = "S|" + date + "|" + normName(prospect) + "|" + setter;
    const L = { id:key, person:setter, role:"Setter", amount:a, dealKey:key, date, week, prospect, offer:String(r["Offer"]||""), cash:0, kind:"show" };
    lines.push(L); S.showRows.push({ key, date, week, prospect, setter, closer: normName(r["Closer"]), amount:a }); P(setter).roles.Setter = 1;
  });

  /* Weeks: every Thursday from the earliest deal to the current week */
  const allDates = S.dealRows.map(d => d.week).concat(S.calls.map(r => String(r["Week (Thu)"]||""))).filter(w => /^\d{4}-\d\d-\d\d$/.test(w));
  const first = allDates.length ? allDates.reduce((a,b) => a < b ? a : b) : thuWeek(todayISO());
  const cur = thuWeek(todayISO());
  S.weeks = []; for(let w = thuWeek(first); w <= cur; w = dayShift(w, 7)) S.weeks.push(w);
  S.weeks.reverse();
  if(!S.fromD){ const r = presetRange("payout"); S.fromD = r[0]; S.toD = r[1]; }

  /* Weekly retainers from the Roster (Kaia's DM line), accrued per week from the config date */
  S.roster.forEach(r => { const name = normName(r["Name"]); const weekly = amt(r["Weekly $"]); if(!name || !weekly) return;
    const active = r["Active"] === null ? true : truthy(r["Active"]); if(!active) return;
    S.weeks.filter(w => w >= KAIA_FROM).forEach(w => {
      const L = { id:"W|" + w + "|" + name, person:name, role:"DM Setter", amount:weekly, dealKey:null, date:w, week:w, prospect:"Weekly DM-setting line", offer:"", cash:0, kind:"weekly" };
      lines.push(L); P(name).roles["DM Setter"] = 1; }); });

  /* Maya's tracker: match each of her rows to a deal or an installment line */
  const dealFor = row => S.dealRows.find(d => {
    const w = d.whop || {};
    const nm = nameLike(row.name, d.prospect) || nameLike(row.name, w["Whop Billing Name"]) || nameLike(row.name, w["Whop Enrollment Name"]);
    if(!nm) return false;
    return Math.abs(d.cash - row.cash) < 1 || !row.cash; });
  const instFor = row => lines.find(L => L.kind === "installment" && Math.abs(L.cash - row.cash) < 1 && nameLike(row.name, L.prospect) && Math.abs(daysBetween(L.date, row.date)) <= 10);
  S.maya.rows.forEach(row => { const I = instFor(row); if(I && !I.maya){ row.matched = { kind:"installment", line:I }; I.maya = row; return; }
    const d = dealFor(row); if(d && !d.maya){ row.matched = { kind:"deal", deal:d }; d.maya = row; } });
  /* Maya's tracker names a closer for money the Cash Log never saw (link closes, legacy installments): her row is the source */
  S.maya.rows.filter(r => !r.matched && r.cash > 0 && isPerson(r.closer) && r.closer !== "UNSURE").forEach(r => {
    const closer = r.closer, setter = (isPerson(r.setter) && r.setter !== "UNSURE") ? r.setter : "";
    const key = "M|" + r.date + "|" + normName(r.name) + "|" + closer, week = thuWeek(r.date), flat = week >= FLAT_FROM;
    /* verify against Whop: an orphan installment or a Whop-only recon row with the same amount and a similar name */
    let status = "NOT ON WHOP", w = null;
    const oc = (S.orphanCycles || []).find(c => !c.used && Math.abs(c.amount - r.cash) < 1 && (nameLike(r.name, c.name) || (r.email && r.email === c.email)) && Math.abs(daysBetween(c.date, r.date)) <= 10);
    if(oc){ oc.used = true; status = "MATCHED"; }
    else { w = S.whop.find(x => !x.used && /^WHOP ONLY/.test(String(x["Recon Status"])) && Math.abs(amt(x["Whop Amount"]) - r.cash) < 1 && (nameLike(r.name, x["Whop Billing Name"]) || nameLike(r.name, x["Whop Enrollment Name"]) || nameLike(r.name, String(x["Whop Email"]||"").split("@")[0]) || (r.email && r.email === String(x["Whop Email"]||"").toLowerCase())));
      if(w){ w.used = true; status = "MATCHED"; } }
    const isInst = r.isInstallment || /installment/i.test(r.plan);
    const d = { i:-1, key, date:r.date, week, prospect:r.name, closer, setter, offer: isInst ? "Installment" : (/lite|497|starter/i.test(r.offer) || r.cash === 497 ? "$497 Starter" : "$3K Strategy"), payType: isInst ? "Plan" : (/plan/i.test(r.plan) ? "Plan" : "PIF"),
      cash:r.cash, revenue:r.cash, collected:r.cash, remaining:0, lastPayment: w ? String(w["Whop Paid Date"]||"") : (oc ? oc.date : ""), installments:0, email:r.email, flat, whop:w, whopStatus:status, refunded: w ? amt(w["Whop Refunded"]) : 0,
      closerComm:0, setterComm:0, dmSetter: closer === "KAIA" ? "KAIA" : "", lines:[], maya:r, source:"maya" };
    r.matched = { kind:"deal", deal:d };
    const ro = rosterFor(closer); const rate = ro && ro.closerRate ? ro.closerRate : D.closerRate;
    d.closerComm = Math.round(r.cash * rate * 100) / 100;
    const L = { id:key+"|C", person:closer, role:"Closer", amount:d.closerComm, dealKey:key, date:r.date, week, prospect:r.name, offer:d.offer, cash:r.cash, kind: isInst ? "installment" : "close" };
    lines.push(L); d.lines.push(L); P(closer).roles.Closer = 1;
    if(setter && !isInst){ d.setterComm = flat ? (rosterFor(setter) && rosterFor(setter).close || D.close) : Math.round(r.cash * SETTER_BEFORE * 100) / 100;
      const SL = { id:key+"|S", person:setter, role:"Setter", amount:d.setterComm, dealKey:key, date:r.date, week, prospect:r.name, offer:d.offer, cash:r.cash, kind: flat ? "set-close" : "set-pct" }; lines.push(SL); d.lines.push(SL); P(setter).roles.Setter = 1; }
    if(TEAM_RATE > 0){ const t = Math.round(r.cash * TEAM_RATE * 100) / 100;
      if(TEAM_TO){ const TL = { id:key+"|T", person:TEAM_TO, role:"Team", amount:t, dealKey:key, date:r.date, week, prospect:r.name, offer:d.offer, cash:r.cash, kind:"team" }; lines.push(TL); d.lines.push(TL); }
      else S.teamUnassigned.push({ date:r.date, amount:t, prospect:r.name }); }
    S.dealRows.push(d); });

  /* Everything on or before HQ Config → "Paid through" was paid out already (Patrick, 8/28) */
  const PAID_THROUGH = cfgDate("Paid through", ""); S.paidThrough = PAID_THROUGH;
  if(/^\d{4}-\d\d-\d\d$/.test(PAID_THROUGH)) lines.filter(L => !L.paid && L.date <= PAID_THROUGH).forEach(L => { L.paid = true; L.payout = { "Payout ID":"Historical", "Date Paid": PAID_THROUGH, "Paid By":"Maya", source:"through" }; });

  /* A block Maya marked "Wire Transfer Sent" pays every line dated inside it */
  S.maya.blocks.filter(b => b.wireSent && b.from && b.to).forEach(b => {
    lines.filter(L => !L.paid && L.date >= b.from && L.date <= b.to).forEach(L => { L.paid = true; L.payout = { "Payout ID":"Maya wire", "Date Paid": b.wireDate || b.to, "Paid By":"Maya", source:"maya" }; }); });

  /* Payouts → which lines are paid. Lines listed in "Deals Covered" are paid outright;
     payouts with no line list are applied FIFO to that person's oldest unpaid lines. */
  const byId = {}; lines.forEach(L => { byId[L.id] = L; if(!L.paid){ L.paid = false; L.payout = null; } });
  const live = S.payouts.filter(p => !truthy(p["Voided"]));
  live.forEach(p => { String(p["Deals Covered"]||"").split(",").map(s => s.trim()).filter(Boolean).forEach(id => { if(byId[id] && !byId[id].paid){ byId[id].paid = true; byId[id].payout = p; } }); });
  live.filter(p => !has(p["Deals Covered"])).forEach(p => {
    let left = amt(p["Amount Paid"]); const who = normName(p["Person"]);
    lines.filter(L => L.person === who && !L.paid).sort((a,b) => a.date < b.date ? -1 : 1).forEach(L => { if(left >= L.amount - 0.005 && L.amount > 0){ left -= L.amount; L.paid = true; L.payout = p; } });
  });

  lines.forEach(L => P(L.person).lines.push(L));
  S.lines = lines; S.people = people;
  S.dealRows.forEach(d => { d.closerPaid = d.lines.some(L => L.role === "Closer" && L.paid); d.setterPaid = d.lines.some(L => L.role === "Setter" && L.paid); });

  /* Review queue */
  S.reviews = buildReviews();
}

function personSummary(p){
  const unpaid = p.lines.filter(L => !L.paid), paid = p.lines.filter(L => L.paid), held = [];
  const owed = unpaid.reduce((s,L) => s + L.amount, 0);
  const periodLines = unpaid.filter(L => inRange(L.date)), outside = unpaid.filter(L => !inRange(L.date));
  const owedPeriod = periodLines.reduce((s,L) => s + L.amount, 0), owedOutside = outside.reduce((s,L) => s + L.amount, 0);
  const earnedAll = p.lines.reduce((s,L) => s + L.amount, 0);
  return { owed, owedPeriod, owedOutside, periodLines, outside, unpaid, paid, held, earnedAll, paidAll: paid.reduce((s,L) => s + L.amount, 0), heldAmt: held.reduce((s,L) => s + L.amount, 0) };
}

/* ---------------- review rules ---------------- */
function buildReviews(){
  const out = [], today = todayISO(), cutoff = dayShift(today, -CFG.REVIEW_WINDOW_DAYS);
  const dismissed = new Set(S.dismissed.map(r => String(r["Notification ID"]||"")));
  const add = (id, level, ttl, detail, opts) => out.push(Object.assign({ id, level, title:ttl, detail, dismissed: dismissed.has(id) }, opts || {}));

  /* feed health (locked = cannot be dismissed) */
  if(S.errors.Deals) add("feed|deals-error", "U", "Deals feed unreadable", esc(S.errors.Deals), {locked:true});
  else if(!S.deals.length) add("feed|deals-empty", "U", "Deals tab is empty", "Open the HQ sheet, click cell A1 on the Deals tab and press <b>Allow access</b> on the IMPORTRANGE prompt. Do the same on Calls, Whop and Whop Payments. Until then nothing below can be computed.", {locked:true});
  if(!S.errors.Deals && S.deals.length && !S.whop.length) add("feed|whop-empty", "U", "Whop tab is empty", "Whop verification is off. Allow access on the Whop tab's IMPORTRANGE cell, and check the Whop Recon job on the Master Tracker ran.", {locked:true});
  const hqErr = S.errors.Roster || S.errors.Payouts || S.errors.Config || S.errors.Dismissed || S.errors.Maya;
  if(hqErr) add("feed|hq-unreadable", "U", "Sales Team HQ sheet tabs unreadable", esc(String(hqErr)) + ". Default rates are in use, nothing shows as paid, and dismissals will not stick. The sheet must stay shared as Anyone with the link → Viewer and the HQ tabs must keep their names.", {locked:true});
  if(!CFG.WEBAPP) add("cfg|no-webapp", "U", "Write endpoint not configured", "Paid and Dismiss checkboxes will not save. Deploy the Apps Script web app and paste its /exec URL into <span class=\"mono\">CFG.WEBAPP</span> in index.html.", {locked:true});
  const stamp = whopRefreshed();
  if(stamp){ const ageH = (Date.now() - stamp.getTime()) / 36e5, lim = cfgNum("Stale feed after (hours)", CFG.DEFAULTS.staleHours);
    if(ageH > lim) add("feed|whop-stale|" + stamp.toISOString().slice(0,10), "U", "Whop feed is " + Math.round(ageH) + " hours old", "Last refresh " + esc(stamp.toLocaleString()) + ". The daily <span class=\"mono\">runWhopRecon()</span> trigger on the Master Tracker may have died. New payments are not being verified.", {locked:true}); }

  /* Whop payment with no EOC form = unattributed cash (link close) */
  S.whop.filter(r => /^WHOP ONLY/.test(String(r["Recon Status"])) && !r.used && String(r["Whop Paid Date"]||"") >= cutoff && !/subscription_cycle/.test(String(r["Whop Billing Reason"]||"")) && amt(r["Whop Amount"]) >= 497)
    .forEach(r => { const id = "whop-only|" + String(r["Whop Payment ID"]||r["Whop Email"]||r["Whop Billing Name"]);
      add(id, "U", money(amt(r["Whop Amount"])) + " from " + String(r["Whop Billing Name"]||"") + ": nobody is assigned", "Paid " + esc(fmtDY(r["Whop Paid Date"])) + " (" + esc(r["Whop Email"]||"") + ") with no EOC form and no closer on Maya's tracker. Add the closer on the Commissions Tracker and it pays out; dismiss if it earns nobody anything.", {kind:"whop-only"}); });

  /* EOC deal with no Whop payment = commission would be paid on unverified cash */
  S.dealRows.filter(d => /^EOC ONLY/.test(d.whopStatus) && d.date >= cutoff).forEach(d => {
    add("eoc-only|" + d.key, "U", money(d.cash) + " logged for " + d.prospect + ", no Whop payment found",
      esc(title(d.closer)) + " filed an EOC on " + esc(fmtDY(d.date)) + " (" + esc(d.offer) + ", " + esc(d.payType) + "). Whop shows no matching payment. Commission of " + money(d.closerComm + d.setterComm) + " is owed against cash that has not landed. Hold it or confirm the payment came in off-Whop.", {kind:"eoc-only", dealKey:d.key}); });

  /* Refund on a deal */
  S.dealRows.filter(d => d.refunded > 0).forEach(d => {
    const paidLines = d.lines.filter(L => L.paid);
    if(paidLines.length) add("refund-paid|" + d.key + "|" + d.refunded, "U", money(d.refunded) + " refunded on " + d.prospect + ", commission already paid",
      "Whop refunded " + money(d.refunded) + " of " + money(d.cash) + ". " + esc(paidLines.map(L => title(L.person) + " " + money(L.amount)).join(", ")) + " already paid out on this deal. No clawback rule exists (Config: <i>Clawback on refund</i>), so nothing is deducted automatically. Decide and log an adjustment in Ledger 2 if needed.", {kind:"refund", dealKey:d.key});
    else add("refund-unpaid|" + d.key + "|" + d.refunded, "I", money(d.refunded) + " refunded on " + d.prospect + " before payout",
      "Whop refunded " + money(d.refunded) + " of " + money(d.cash) + " and the commission (" + money(d.closerComm + d.setterComm) + ") has not been paid yet. Confirm whether it should still be paid in full.", {kind:"refund", dealKey:d.key}); });

  /* Reps not on the roster */
  Object.keys(S.people).filter(k => !S.people[k].roster).forEach(k => {
    add("roster|" + k, "I", title(k) + " is not on the Roster tab", "Deals name <b>" + esc(title(k)) + "</b> but the Roster has no row for them, so default rates apply (closer " + Math.round(CFG.DEFAULTS.closerRate*100) + "%, setter $" + CFG.DEFAULTS.show + "/$" + CFG.DEFAULTS.close + "). Add a row or fix the spelling on the EOC form.", {kind:"roster"}); });

  /* Payment plan looks late: balance left and no payment in 35 days */
  S.dealRows.filter(d => /plan/i.test(d.payType) && d.remaining > 0 && d.lastPayment && daysBetween(d.lastPayment, today) > cfgNum("Late plan after (days)", CFG.DEFAULTS.lateDays)).forEach(d => {
    add("late|" + d.key + "|" + d.lastPayment, "I", d.prospect + " may be late on her plan", "Last payment " + esc(fmtDY(d.lastPayment)) + " (" + daysBetween(d.lastPayment, today) + " days ago). Collected " + money(d.collected) + " of " + money(d.revenue) + ", " + money(d.remaining) + " remaining. Closer " + esc(title(d.closer)) + " has been paid on the cash so far only.", {kind:"late", dealKey:d.key}); });

  const order = { U:0, I:1 };
  return out.sort((a,b) => (a.locked ? -1 : 0) - (b.locked ? -1 : 0) || order[a.level] - order[b.level]);
}
function whopRefreshed(){

/* ----- Pay Period ----- */
function presetRange(v){
  const t = todayISO(), cur = thuWeek(t), ym = t.slice(0,7);
  const monthEnd = ym => { const p = ym.split("-"); return new Date(Date.UTC(+p[0], +p[1], 0)).toISOString().slice(0,10); };
  const prevYm = ym => { const p = ym.split("-"); return new Date(Date.UTC(+p[0], +p[1]-2, 1)).toISOString().slice(0,7); };
  switch(v){
    /* Payout week: Sat–Thu, paid the following Friday via Gusto (Taylor, 8/28). The Thursday on or before today closes the period. */
    case "payout": { const thu = dayShift(cur, cur > t ? -7 : 0); return [dayShift(thu, -5), thu]; }
    case "payout-prev": { const thu = dayShift(cur, cur > t ? -7 : 0); return [dayShift(thu, -12), dayShift(thu, -7)]; }
    case "this-week": return [cur, dayShift(cur, 6)];
    case "last-week": return [dayShift(cur, -7), dayShift(cur, -1)];
    case "this-month": return [ym + "-01", monthEnd(ym)];
    case "last-month": { const q = prevYm(ym); return [q + "-01", monthEnd(q)]; }
    case "30": return [dayShift(t, -29), t];
    case "all": { const ds = S.dealRows.map(d => d.date).concat(S.lines.map(L => L.date)).filter(x => /^\d{4}-\d\d-\d\d$/.test(x)).sort(); return [ds[0] || t, t]; }
    default: return null;
  }
}
function presetFor(a, b){
  for(const v of ["payout","payout-prev","this-week","last-week","this-month","last-month","30","all"]){ const r = presetRange(v); if(r && r[0] === a && r[1] === b) return v; }
  return "custom";
}

  if(outside.length) body += '<div class="sec" style="margin-top:14px">Unpaid outside this period · ' + outside.length + ' line' + (outside.length === 1 ? "" : "s") + ' · ' + money(s.owedOutside) + '</div><div class="tw">' + tableInner(heads, outside.map(lineRow), {left:[1,2,4]}) + '</div>';
  if(paid.length) body += '<div class="sec" style="margin-top:14px">Paid · ' + paid.length + ' line' + (paid.length === 1 ? "" : "s") + ' · ' + money(s.paidAll) + '</div><div class="tw">' + tableInner(heads.concat(["Payout"]), paid.map(L => lineRow(L).concat([esc(fmtD(L.payout ? L.payout["Date Paid"] : "")) + ' <span class="mute">' + esc(String(L.payout ? L.payout["Payout ID"] : "")) + '</span>'])), {left:[1,2,4]}) + '</div>';
  if(p.roster && p.roster.notes) body += '<div class="sec" style="margin-top:14px">Roster note</div><div style="padding:0 20px 16px;font-size:12.5px;color:var(--ink-2)">' + esc(p.roster.notes) + '</div>';
  openDrawer(title(k), esc(Object.keys(p.roles).join(" + ")) + (p.roster ? "" : ' · <span class="pill chk">not on roster</span>') + ' · earned ' + money(s.earnedAll) + ' all time',
    body, s.owedPeriod > 0.004 ? '<span style="font-size:13px">Owed this period <b style="font-family:var(--mono)">' + money(s.owedPeriod) + '</b></span><button class="btn primary" id="dr-pay">Mark paid ' + money(s.owedPeriod) + '</button>' : '<span class="pill ok">Nothing owed this period</span>');
  const b = document.getElementById("dr-pay"); if(b) b.onclick = () => confirmPayout(k);
}
function openDismissed(){
  const rows = S.reviews.filter(r => r.dismissed).map(r => { const d = S.dismissed.find(x => String(x["Notification ID"]) === r.id) || {};
    return ['<span class="lv ' + (r.level === "U" ? "u" : "i") + '">' + (r.level === "U" ? "Urgent" : "Info") + '</span>', esc(r.title), esc(fmtD(d["Dismissed At"])) + (has(d["Dismissed By"]) ? ' <span class="mute">' + esc(d["Dismissed By"]) + '</span>' : ''), '<button class="btn sm restore" data-id="' + esc(r.id) + '">Restore</button>']; });
  openDrawer("Dismissed", rows.length + " item" + (rows.length === 1 ? "" : "s") + " hidden from the review queue", '<div class="tw">' + tableInner(["","Item","Dismissed",""], rows, {left:[0,1,2]}) + '</div>');
  document.querySelectorAll(".restore").forEach(b => b.onclick = () => writeAction({action:"undismiss", id:b.dataset.id}, "Restored").then(() => { closeDrawer(); }));
}

/* ----- Ledger 1: deals ----- */
const L1 = { q:"", person:"", offer:"", sort:"date", dir:"desc" };
function renderL1(){
  document.getElementById("pg-title").textContent = "Ledger 1 · Deals";
  document.getElementById("pg-sub").textContent = "Every deal since " + (S.dealRows.length ? fmtDY(S.dealRows.map(d => d.date).sort()[0]) : "—") + ", joined to Whop";
  document.getElementById("pg-ctl").innerHTML = '<button class="btn" id="csv1">Download CSV</button>';
  const people = Object.keys(S.people).sort(), offers = [...new Set(S.dealRows.map(d => d.offer).filter(Boolean))].sort();
  let rows = S.dealRows.filter(d => (!L1.person || d.closer === L1.person || d.setter === L1.person) && (!L1.offer || d.offer === L1.offer) && (!L1.q || (d.prospect + " " + d.closer + " " + d.setter + " " + d.whopStatus + " " + (d.whop ? d.whop["Whop Email"] : "")).toLowerCase().includes(L1.q.toLowerCase())));
  const keyf = { date:d => d.date, prospect:d => d.prospect.toLowerCase(), cash:d => d.cash, closer:d => d.closer, setter:d => d.setter, offer:d => d.offer }[L1.sort] || (d => d.date);
  rows.sort((a,b) => { const x = keyf(a), y = keyf(b); return (x < y ? -1 : x > y ? 1 : 0) * (L1.dir === "asc" ? 1 : -1); });
  const total = rows.reduce((s,d) => s + d.cash, 0);
  const th = (label, key, left) => '<th class="sort ' + (left ? "l" : "") + '" data-key="' + key + '"' + (L1.sort === key ? ' data-dir="' + L1.dir + '"' : '') + '>' + label + '</th>';
  let h = '<div class="panel"><div class="panel-head"><span>Deals</span><span class="r">' + num(rows.length) + ' of ' + num(S.dealRows.length) + ' · ' + money(total) + '</span></div>' +
    '<div class="filters"><input type="search" id="f-q" placeholder="Search customer, rep, email" value="' + esc(L1.q) + '">' +
    '<select id="f-person"><option value="">All reps</option>' + people.map(p => '<option value="' + esc(p) + '"' + (L1.person === p ? ' selected' : '') + '>' + esc(title(p)) + '</option>').join("") + '</select>' +
    '<select id="f-offer"><option value="">All offers</option>' + offers.map(o => '<option value="' + esc(o) + '"' + (L1.offer === o ? ' selected' : '') + '>' + esc(o) + '</option>').join("") + '</select></div>' +
    '<div class="tw"><table><thead><tr>' + th("Date","date") + th("Customer","prospect",1) + th("Offer","offer",1) + th("Collected","cash") + '<th>Paid to date</th><th>Remaining</th><th>Last payment</th><th class="l">Pay type</th><th>Payment</th>' + th("Closer","closer",1) + '<th>Closer comm</th><th>Paid?</th>' + th("Setter","setter",1) + '<th>Setter comm</th><th>Paid?</th><th class="l">DM setter</th></tr></thead><tbody>' +
    (rows.length ? rows.map(d => '<tr>' + [esc(fmtDY(d.date)), esc(d.prospect), esc(d.offer), money(d.cash), /plan/i.test(d.payType) ? money(d.collected) + (d.installments ? ' <span class="mute">(' + (d.installments + 1) + ' pmts)</span>' : '') : "—", /plan/i.test(d.payType) && d.remaining > 0 ? money(d.remaining) : "—", /plan/i.test(d.payType) && d.lastPayment ? esc(fmtD(d.lastPayment)) : "—", esc(d.payType) || "—", statusPill(d) || "—",
      isPerson(d.closer) ? esc(title(d.closer)) : "—", d.closerComm ? money(d.closerComm) : "—", paidPill(d.closerPaid, d.closerComm) || "—",
      isPerson(d.setter) ? esc(title(d.setter)) : "—", d.setterComm ? money(d.setterComm) : "—", paidPill(d.setterPaid, d.setterComm) || "—", d.dmSetter ? esc(title(d.dmSetter)) : "—"]
      .map((c,i) => '<td class="' + ([1,2,7,9,12,15].includes(i) ? "l" : "") + (c === "—" ? " mute" : "") + '">' + c + '</td>').join("") + '</tr>').join("") : '<tr><td colspan="16" class="l mute" style="text-align:center;padding:18px">No deals match.</td></tr>') +
    '</tbody></table></div></div>';
  h += '<div class="note"><p><strong>Payment</strong>: <span class="pill ok">Verified</span> the money is on Whop · <span class="pill chk">Pending</span> closed in the last two days, Whop check runs at 6 AM · <span class="pill bad">No payment found</span> a form was filed and no money landed, do not pay on it yet. <strong>Paid to date / Remaining / Last payment</strong> only apply to payment plans. Commission is earned on each payment as it lands.</p></div>';
  const pg = document.getElementById("page-l1"); pg.innerHTML = h;
  document.getElementById("f-q").oninput = e => { L1.q = e.target.value; renderL1(); document.getElementById("f-q").focus(); const i = document.getElementById("f-q"); i.setSelectionRange(i.value.length, i.value.length); };
  document.getElementById("f-person").onchange = e => { L1.person = e.target.value; renderL1(); };
  document.getElementById("f-offer").onchange = e => { L1.offer = e.target.value; renderL1(); };
  pg.querySelectorAll("th.sort").forEach(t => t.onclick = () => { const k = t.dataset.key; if(L1.sort === k) L1.dir = L1.dir === "asc" ? "desc" : "asc"; else { L1.sort = k; L1.dir = k === "date" || k === "cash" ? "desc" : "asc"; } renderL1(); });
  document.getElementById("csv1").onclick = () => downloadCSV("sca-deals-" + todayISO() + ".csv", [["Date","Customer","Offer","Collected (initial)","Paid to date","Contracted","Remaining","Last payment","Pay type","Payment status","Closer","Closer commission","Closer paid","Setter","Setter commission","Setter paid","DM setter"]].concat(rows.map(d => [d.date, d.prospect, d.offer, d.cash, d.collected, d.revenue, d.remaining, d.lastPayment, d.payType, d.whopStatus, title(d.closer), d.closerComm, d.closerPaid ? "yes" : "no", isPerson(d.setter) ? title(d.setter) : "", d.setterComm, d.setterPaid ? "yes" : "no", title(d.dmSetter)])));
}

/* ----- Ledger 2: payouts ----- */
function renderL2(){
  document.getElementById("pg-title").textContent = "Ledger 2 · Payouts";
  const live = S.payouts.filter(p => !truthy(p["Voided"])), voided = S.payouts.filter(p => truthy(p["Voided"]));
  const mayaPaid = b => S.lines.filter(L => L.paid && L.payout && L.payout.source === "maya" && L.date >= b.from && L.date <= b.to);
  const wires = S.maya.blocks.filter(b => b.wireSent).map(b => ({ label:b.label, date:b.wireDate, amount: mayaPaid(b).reduce((s,L) => s + L.amount, 0), n: mayaPaid(b).length })).filter(w => w.n > 0);
  const hist = S.lines.filter(L => L.paid && L.payout && L.payout.source === "through");
  const histBy = {}; hist.forEach(L => histBy[L.person] = (histBy[L.person] || 0) + L.amount);
  const total = live.reduce((s,p) => s + amt(p["Amount Paid"]), 0) + wires.reduce((s,w) => s + w.amount, 0) + hist.reduce((s,L) => s + L.amount, 0);
  document.getElementById("pg-sub").textContent = num(live.length) + " payout" + (live.length === 1 ? "" : "s") + " · " + money(total) + " sent to the sales team" + (voided.length ? " · " + voided.length + " voided" : "");
  document.getElementById("pg-ctl").innerHTML = '<button class="btn" id="csv2">Download CSV</button>';
  const byPerson = {}; live.forEach(p => { const k = normName(p["Person"]); byPerson[k] = (byPerson[k] || 0) + amt(p["Amount Paid"]); });
  let h = '';
  const names = Object.keys(byPerson).sort((a,b) => byPerson[b] - byPerson[a]);
  if(names.length) h += panel("Paid to date", '<div class="r4">' + names.slice(0,4).map(k => cell(title(k), money(byPerson[k]), {sub: live.filter(p => normName(p["Person"]) === k).length + " payouts"})).join("") + '</div>');
  const rows = S.payouts.slice().sort((a,b) => String(a["Logged At"]||a["Date Paid"]) < String(b["Logged At"]||b["Date Paid"]) ? 1 : -1).map(p => {
    const ids = String(p["Deals Covered"]||"").split(",").map(s => s.trim()).filter(Boolean); const v = truthy(p["Voided"]);
    const names = ids.map(id => (S.lines.find(L => L.id === id) || {}).prospect).filter(Boolean);
    return [esc(fmtDY(p["Date Paid"])), esc(title(p["Person"])), esc(p["Role"] || "") || null, (v ? '<s>' : '') + money(amt(p["Amount Paid"])) + (v ? '</s>' : ''), has(p["Period"]) ? esc(String(p["Period"]).replace(/(\d{4}-\d\d-\d\d) to (\d{4}-\d\d-\d\d)/, (m,a,b) => fmtD(a) + " – " + fmtD(b))) : null,
      ids.length ? '<button class="name-btn lines-btn" data-id="' + esc(p["Payout ID"]) + '">' + ids.length + ' line' + (ids.length === 1 ? "" : "s") + '</button>' : '<span class="mute">FIFO</span>',
      names.length ? esc(names.slice(0,3).join(", ")) + (names.length > 3 ? " +" + (names.length - 3) : "") : null,
      esc(p["Paid By"] || "") || null, esc(p["Notes"] || "") || null, '<span class="mute">' + esc(p["Payout ID"]) + '</span>',
      v ? '<span class="pill bad">voided</span>' : '<button class="btn sm danger void-btn" data-id="' + esc(p["Payout ID"]) + '">Void</button>']; });
  if(hist.length) h += panel("Paid before " + esc(fmtDY(S.paidThrough)) + " · historical payouts, already sent", '<div class="tw">' + tableInner(["Rep","Lines","Commission paid"], Object.keys(histBy).sort((a,b) => histBy[b] - histBy[a]).map(k => [esc(title(k)), num(hist.filter(L => L.person === k).length), money(histBy[k])]), {left:[0]}) + '</div>', "HQ Config → Paid through");
  if(wires.length) h += panel("Wires on Maya's Commissions Tracker · blocks marked Wire Transfer Sent", '<div class="tw">' + tableInner(["Period","Wire date","Lines covered","Commission covered"], wires.map(w => [esc(w.label), esc(w.date || "—"), num(w.n), money(w.amount)]), {left:[0,1]}) + '</div>', "read-only");
  h += panel("Payouts", '<div class="tw">' + tableInner(["Paid","Rep","Role","Amount","Period","Lines","Deals","Paid by","Notes","ID",""], rows, {left:[1,2,6,7,8,9], empty:"No payouts logged yet. Tick Paid on the Pay Period page and the first one lands here."}) + '</div>', "newest first");
  h += '<div class="note"><p><strong>Ledger 2 is the record of money actually sent.</strong> Each row is written when someone ticks Paid, and lists the exact commission lines it covered. <strong>Void</strong> keeps the row but un-marks its lines, so the amount goes back to owed. Nothing here is ever deleted.</p></div>';
  const pg = document.getElementById("page-l2"); pg.innerHTML = h;
  pg.querySelectorAll(".lines-btn").forEach(b => b.onclick = () => openPayout(b.dataset.id));
  pg.querySelectorAll(".void-btn").forEach(b => b.onclick = () => confirmVoid(b.dataset.id));
  document.getElementById("csv2").onclick = () => downloadCSV("sca-payouts-" + todayISO() + ".csv", [["Payout ID","Date Paid","Person","Role","Amount Paid","Period","Deals Covered","Paid By","Notes","Voided"]].concat(S.payouts.map(p => ["Payout ID","Date Paid","Person","Role","Amount Paid","Period","Deals Covered","Paid By","Notes","Voided"].map(k => p[k] ?? ""))));
}
function openPayout(id){
  const p = S.payouts.find(x => String(x["Payout ID"]) === id); if(!p) return;
  const ids = String(p["Deals Covered"]||"").split(",").map(s => s.trim()).filter(Boolean);
  const ls = ids.map(i => S.lines.find(L => L.id === i)).filter(Boolean);
  openDrawer(title(p["Person"]) + " · " + money(amt(p["Amount Paid"])), "Paid " + esc(fmtDY(p["Date Paid"])) + (has(p["Paid By"]) ? " by " + esc(p["Paid By"]) : "") + ' · <span class="mute">' + esc(id) + '</span>',
    '<div class="tw">' + tableInner(["Date","Customer","Offer","Deal","Role on deal","Whop","Commission"], ls.map(lineRow), {left:[1,2,4]}) + '</div>' + (ids.length !== ls.length ? '<div class="empty">' + (ids.length - ls.length) + ' line id(s) on this payout no longer match a deal (the Cash Log row changed).</div>' : ''));
}

/* ---------------- writes ---------------- */
function modal(ttl, body, okLabel, onOk){
  document.getElementById("md-title").textContent = ttl; document.getElementById("md-body").innerHTML = body;
  const ok = document.getElementById("md-ok"); ok.textContent = okLabel; ok.disabled = false;
  const m = document.getElementById("modal"); m.classList.add("on");
  const close = () => { m.classList.remove("on"); ok.onclick = null; };
  document.getElementById("md-cancel").onclick = () => { close(); if(onOk.cancel) onOk.cancel(); };
  ok.onclick = async () => { ok.disabled = true; try { await onOk(); close(); } catch(e){ ok.disabled = false; const er = document.getElementById("md-err"); if(er){ er.hidden = false; er.textContent = e.message; } } };
  const f = m.querySelector("input,textarea"); if(f) f.focus();
}
function confirmPayout(k, onCancel){
  const p = S.people[k]; const s = personSummary(p);
  if(s.owedPeriod <= 0.004){ toast(title(k) + " has nothing owed in this period."); if(onCancel) onCancel(); return; }
  const by = localStorage.getItem("hq.paidBy") || "";
  const fn = async () => {
    const paidBy = document.getElementById("md-by").value.trim(), notes = document.getElementById("md-notes").value.trim(), date = document.getElementById("md-date").value;
    if(!paidBy) throw new Error("Who sent it? Put a name in Paid by.");
    if(!/^\d{4}-\d\d-\d\d$/.test(date)) throw new Error("Date needs to be YYYY-MM-DD.");
    localStorage.setItem("hq.paidBy", paidBy);
    await writeAction({ action:"payout", person:k, role:Object.keys(p.roles).join(" + "), amount:Math.round(s.owedPeriod*100)/100, period:S.fromD + " to " + S.toD, datePaid:date, lines:s.periodLines.map(L => L.id), paidBy, notes }, "Logged " + money(s.owedPeriod) + " to " + title(k));
    closeDrawer();
  }; fn.cancel = onCancel;
  modal("Mark " + title(k) + " paid", '<div class="kv"><b>Amount</b><span style="font-family:var(--mono);font-weight:600">' + money(s.owedPeriod) + '</span><b>Period</b><span>' + esc(fmtD(S.fromD)) + ' – ' + esc(fmtD(S.toD)) + '</span><b>Covers</b><span>' + s.periodLines.length + ' line' + (s.periodLines.length === 1 ? "" : "s") + '</span></div>' +
    (s.owedOutside > 0.004 ? '<div class="note warn" style="padding:8px 12px"><span>' + money(s.owedOutside) + ' more is unpaid outside this period (' + s.outside.length + ' line' + (s.outside.length === 1 ? "" : "s") + '). It is not included; widen the range to pay it.</span></div>' : '') +
    '<label>Date paid<input type="text" id="md-date" value="' + todayISO() + '"></label><label>Paid by<input type="text" id="md-by" value="' + esc(by) + '" placeholder="Your name"></label><label>Note (optional)<input type="text" id="md-notes" placeholder="Gusto, Zelle, partial, etc."></label><div class="err" id="md-err" hidden></div>' +
    '<div style="font-size:12px;color:var(--ink-3)">This writes one row to Ledger 2 and marks every line above as paid. Void it from Ledger 2 if it was a mistake.</div>', "Log payout", fn);
}
function dismissReview(id, onCancel){
  const r = S.reviews.find(x => x.id === id); if(!r) return;
  const by = localStorage.getItem("hq.paidBy") || "";
  const fn = async () => { const who = document.getElementById("md-by").value.trim(); if(!who) throw new Error("Put your name so the team knows who cleared it."); localStorage.setItem("hq.paidBy", who);
    await writeAction({ action:"dismiss", id, title:r.title, by:who, note:document.getElementById("md-notes").value.trim() }, "Dismissed"); };
  fn.cancel = onCancel;
  modal("Dismiss this item", '<div style="font-weight:600;color:var(--ink)">' + esc(r.title) + '</div><label>Your name<input type="text" id="md-by" value="' + esc(by) + '"></label><label>What was done (optional)<input type="text" id="md-notes"></label><div class="err" id="md-err" hidden></div><div style="font-size:12px;color:var(--ink-3)">Hides it for everyone. Restore from the “dismissed” button on the review panel.</div>', "Dismiss", fn);
}
function confirmVoid(id){
  const p = S.payouts.find(x => String(x["Payout ID"]) === id); if(!p) return;
  const fn = async () => { const who = document.getElementById("md-by").value.trim(); if(!who) throw new Error("Put your name."); localStorage.setItem("hq.paidBy", who);
    await writeAction({ action:"void", id, by:who, note:document.getElementById("md-notes").value.trim() }, "Voided " + id); };
  modal("Void payout " + id, '<div class="kv"><b>Rep</b><span>' + esc(title(p["Person"])) + '</span><b>Amount</b><span style="font-family:var(--mono)">' + money(amt(p["Amount Paid"])) + '</span></div><label>Your name<input type="text" id="md-by" value="' + esc(localStorage.getItem("hq.paidBy") || "") + '"></label><label>Why<input type="text" id="md-notes"></label><div class="err" id="md-err" hidden></div><div style="font-size:12px;color:var(--ink-3)">The row stays in Ledger 2 marked voided; its lines go back to owed.</div>', "Void", fn);
}
async function writeAction(payload, okMsg){
  if(!CFG.WEBAPP) throw new Error("No write endpoint configured (CFG.WEBAPP). Nothing was saved.");
  if(!(await ensureToken())) throw new Error("No write key entered. Nothing was saved.");
  const body = JSON.stringify(Object.assign({ token:S.token, client:"hq-web" }, payload));
  let res, txt;
  try { res = await fetch(CFG.WEBAPP, { method:"POST", body, headers:{ "Content-Type":"text/plain;charset=utf-8" }, redirect:"follow" }); txt = await res.text(); }
  catch(e){ throw new Error("Could not reach the write endpoint: " + e.message); }
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error("Write endpoint returned something that is not JSON (HTTP " + res.status + "). Is the deployment set to Anyone?"); }
  if(!j.ok) throw new Error(j.error || "Write failed");
  toast(okMsg + " · syncing…");
  /* the sheet write is synchronous on the server; re-read to render the truth, not an optimistic guess */
  await load();
  toast(okMsg);
  return j;
}

/* ---------------- utils ---------------- */
let toastT; function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function sha256(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }

/* ---------------- boot ---------------- */
function enter(){
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => showPage(b.dataset.page));
  document.getElementById("dr-close").onclick = closeDrawer; document.getElementById("scrim").onclick = closeDrawer;
  document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeDrawer(); document.getElementById("modal").classList.remove("on"); } });
  document.getElementById("page-pay").innerHTML = '<div class="panel"><div class="panel-head">Loading</div><div style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="skel" style="width:60%"></div><div class="skel" style="width:40%"></div><div class="skel" style="width:75%"></div></div></div>';
  load().catch(e => { document.getElementById("page-pay").innerHTML = '<div class="note crit"><p><strong>Could not load the sheet.</strong> ' + esc(e.message) + '</p></div>'; });
  setInterval(() => { if(document.visibilityState === "visible") load().catch(() => {}); }, 10 * 60 * 1000);
}
/* The write key (same value as HQ_TOKEN in the Apps Script) is asked for once per browser, the first time someone ticks a box. */
async function ensureToken(){
  if(S.token) return true;
  let t = ""; try { t = localStorage.getItem("hq.tok") || ""; } catch(_){}
  if(!t){ t = window.prompt("Team write key (ask Patrick or Maya). Needed once on this browser to log payouts and dismiss items.") || ""; t = t.trim(); if(!t) return false; }
  if(CFG.PASS_HASH !== "__PASS_HASH__" && (await sha256(t)) !== CFG.PASS_HASH){ try { localStorage.removeItem("hq.tok"); } catch(_){} toast("That write key is not right."); return false; }
  S.token = t; try { localStorage.setItem("hq.tok", t); } catch(_){} return true;
}
enter();
